<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airtek – Gestión de Energía</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230166ff'/%3E%3Cpath d='M32 8c-2 0-3.5 1-4.2 2.5L18 34h10l-4 22 20-28H34l4-20H32z' fill='white'/%3E%3C/svg%3E">
  
  <!-- Google Fonts: Montserrat + Outfit + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Error Catcher to display any error directly on screen -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.body.innerHTML = '<div style="background:#0f172a;color:#f55b5d;font-family:monospace;padding:30px;min-height:100vh;z-index:999999;position:fixed;top:0;left:0;right:0;bottom:0;overflow:auto">'
        + '<h2 style="color:#0166ff;margin-bottom:16px">Error de JavaScript</h2>'
        + '<p style="font-size:1.1rem;margin-bottom:12px;color:#ffffff">' + msg + '</p>'
        + '<p style="color:#94a3b8;font-size:.85rem">Archivo: ' + src + '</p>'
        + '<p style="color:#94a3b8;font-size:.85rem">Línea: ' + line + ', Columna: ' + col + '</p>'
        + (err && err.stack ? '<pre style="color:#ff7d32;margin-top:16px;white-space:pre-wrap;font-size:.82rem">' + err.stack + '</pre>' : '')
        + '</div>';
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML = '<div style="background:#0f172a;color:#f55b5d;font-family:monospace;padding:30px;min-height:100vh;z-index:999999;position:fixed;top:0;left:0;right:0;bottom:0;overflow:auto">'
        + '<h2 style="color:#0166ff;margin-bottom:16px">Unhandled Promise Rejection</h2>'
        + '<p style="font-size:1.1rem;margin-bottom:12px;color:#ffffff">' + (e.reason ? (e.reason.message || e.reason) : 'Desconocido') + '</p>'
        + (e.reason && e.reason.stack ? '<pre style="color:#ff7d32;margin-top:16px;white-space:pre-wrap;font-size:.82rem">' + e.reason.stack + '</pre>' : '')
        + '</div>';
    });
  </script>

  <!-- Pre-render theme check to prevent flash of wrong theme -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('airtek_theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
