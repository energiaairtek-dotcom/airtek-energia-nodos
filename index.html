        const u2 = db.collection('energy_nodes').doc(node.id).collection('energy_records')
          .orderBy('date', 'desc').limit(40).onSnapshot(s => { setRecords(s.docs.map(d => ({ id: d.id, ...d.data() }))); });
        return () => { u1(); u2(); };
      }, [node.id]);

      const exportPDF = () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
        const pw = doc.internal.pageSize.getWidth();
        let y = 25;

        const slugify = t => t.toLowerCase().replace(/\s+/g, '-').replace(/[^\w-]+/g, '');
        const fmtDateTime = d => d?.toDate ? d.toDate().toLocaleString('es-VE') : new Date(d).toLocaleString('es-VE');

        // Header - Printer Friendly (White background)
        doc.setFontSize(16); doc.setFont('helvetica', 'bold'); doc.setTextColor(0, 0, 0);
        doc.text('REPORTE DE ENERGÍA - AIRTEK', 15, 15);
        doc.setFontSize(8); doc.setFont('helvetica', 'normal'); doc.setTextColor(100, 100, 100);
        doc.text(`Generado: ${new Date().toLocaleString('es-VE')}`, pw - 15, 15, { align: 'right' });
        doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.5); doc.line(15, 18, pw - 15, 18);

        // Info Nodo
        doc.setTextColor(0, 0, 0); doc.setFontSize(14); doc.setFont('helvetica', 'bold');
        doc.text(node.name, 15, y); y += 6;
        doc.setFontSize(9); doc.setFont('helvetica', 'normal'); doc.setTextColor(80, 80, 80);
        doc.text(`Zona: ${node.zone || '—'} | Tipo: ${(NODE_TYPES[node.type] || {}).label || node.type}`, 15, y); y += 10;

        // Equipos Activos
        doc.setTextColor(0, 0, 0); doc.setFontSize(11); doc.setFont('helvetica', 'bold');
        doc.text('EQUIPOS ACTIVOS', 15, y); y += 6;
        const actEq = sortEquipment(equipment.filter(e => e.active !== false));
        if (actEq.length === 0) {
          doc.setFontSize(8); doc.setFont('helvetica', 'normal'); doc.setTextColor(120, 120, 120);
          doc.text('Sin equipos registrados.', 18, y); y += 5;
        }
        actEq.forEach(eq => {
          doc.setTextColor(40, 40, 40); doc.setFontSize(9); doc.setFont('helvetica', 'bold');
          const tagPart = `• ${eq.tag}`;
          doc.text(tagPart, 18, y);
          const tw = doc.getTextWidth(tagPart);
          doc.setFont('helvetica', 'normal'); doc.setTextColor(100, 100, 100);

          const isAC = eq.type === 'INV' || eq.type === 'ATS';
          const vInfo = isAC ? (eq.voltage ? ` ${eq.voltage}` : '') : (eq.voltageDC ? ` ${eq.voltageDC}VDC` : '');

          const infoPart = ` — ${eq.type}${vInfo}${eq.batteryType && eq.batteryType !== 'No aplica' ? ' [' + eq.batteryType + ']' : ''}`;
          doc.text(infoPart, 18 + tw + 1, y);
          y += 5; if (y > 275) { doc.addPage(); y = 25; }
        });
        y += 5;

        // Historial
        doc.setTextColor(0, 0, 0); doc.setFontSize(11); doc.setFont('helvetica', 'bold');
        doc.text('HISTORIAL DE REGISTROS', 15, y); y += 6;
        const histLimit = records.slice(0, 12);
        histLimit.forEach(r => {
          const rt = REC_TYPES[r.type] || { label: r.type, icon: '·' };
          doc.setTextColor(40, 40, 40); doc.setFontSize(9); doc.setFont('helvetica', 'bold');
          doc.text(`${rt.label} — ${fmtDate(r.date)}`, 18, y);
          doc.setFontSize(8); doc.setFont('helvetica', 'normal'); doc.setTextColor(100, 100, 100);
          doc.text(`Técnico: ${r.technicianName || '—'}`, 120, y);
          y += 4;
          if (r.observations) {
            const obsLines = doc.splitTextToSize(`Obs: ${r.observations}`, 165);
            doc.setFont('helvetica', 'italic'); doc.setTextColor(120, 120, 120);
            obsLines.forEach(l => { doc.text(l, 21, y); y += 4; if (y > 275) { doc.addPage(); y = 25; } });
          }
          y += 2; if (y > 275) { doc.addPage(); y = 25; }
        });

        // ─── GRÁFICA DE CARGAS HISTÓRICAS (Grayscale) ───
        const inspRecs = records.filter(r => (r.type === 'inspeccion' || r.type === 'actualizacion_carga') && r.measurements && Object.keys(r.measurements).length > 0).slice().reverse();
        if (inspRecs.length > 0) {
          if (y > 230) { doc.addPage(); y = 25; }
          doc.setTextColor(0, 0, 0); doc.setFontSize(11); doc.setFont('helvetica', 'bold');
          doc.text('GRÁFICO DE CARGAS (kW)', 15, y); y += 8;

          const chartH = 35; const chartW = 170; const startX = 20; const chartY = y + chartH;
          const seriesData = inspRecs.map(r => {
            let t = 0; Object.entries(r.measurements || {}).forEach(([tag, vals]) => {
              const type = getEqTypeFromTag(tag, equipment);
              const ld = calcLoad(type, vals);
              t += ld.ac + ld.dc;
            });
            return { label: fmtDate(r.date).slice(0, 5), val: t };
          });
          const maxVal = Math.max(...seriesData.map(s => s.val), 0.5) * 1.2;

          doc.setDrawColor(200, 200, 200); doc.setLineWidth(0.2);
          doc.line(startX, chartY, startX + chartW, chartY);
          [0, 0.5, 1].forEach(p => {
            const gy = chartY - (chartH * p);
            doc.line(startX, gy, startX + chartW, gy);
            doc.setTextColor(150, 150, 150); doc.setFontSize(7);
            doc.text((maxVal * p).toFixed(1), startX - 2, gy + 1, { align: 'right' });
          });

          const barW = Math.min(12, (chartW / seriesData.length) - 4);
          seriesData.forEach((s, i) => {
            const bh = (s.val / maxVal) * chartH;
            const bx = startX + 10 + i * (chartW / seriesData.length);
            doc.setFillColor(100, 100, 100); doc.rect(bx - barW / 2, chartY - bh, barW, bh, 'F');
            doc.setTextColor(0, 0, 0); doc.setFontSize(7); doc.setFont('helvetica', 'bold');
            doc.text(s.val.toFixed(2), bx, chartY - bh - 2, { align: 'center' });
            doc.setTextColor(120, 120, 120); doc.setFontSize(6); doc.setFont('helvetica', 'normal');
            doc.text(s.label, bx, chartY + 4, { align: 'center' });
          });
          y += chartH + 15;
        }

        // ─── RESUMEN DE CARGAS POR BANCO (Printer Friendly) ───
        if (inspRecs.length > 0) {
          const lastR = inspRecs[inspRecs.length - 1];
          if (y > 240) { doc.addPage(); y = 25; }
          doc.setTextColor(0, 0, 0); doc.setFontSize(11); doc.setFont('helvetica', 'bold');
          doc.text('RESUMEN DE BANCOS Y AUTONOMÍA', 15, y); y += 8;

          const allB = new Set();
          Object.keys(lastR.measurements).forEach(tag => { const b = getBankId(tag); if (b) allB.add(b); });
          const bks = Array.from(allB).sort();

          let col = 0;
          bks.forEach(bank => {
            const bLoad = Object.entries(lastR.measurements).reduce((sum, [tag, vals]) => {
              if (getBankId(tag) !== bank) return sum;
              const type = getEqTypeFromTag(tag, equipment);
              const ld = calcLoad(type, vals);
              return { ac: sum.ac + ld.ac, dc: sum.dc + ld.dc };
            }, { ac: 0, dc: 0 });
            const batEq = equipment.find(e => e.type === 'BAT' && getBankId(e.tag) === bank);
            const aut = calcAutonomy(batEq, bLoad.ac, bLoad.dc);

            const cardX = 15 + col * 92;
            if (y > 260) { doc.addPage(); y = 25; }

            // Card Printer Friendly (Border only)
            doc.setDrawColor(180, 180, 180); doc.setLineWidth(0.3);
            doc.rect(cardX, y, 88, 24);

            doc.setTextColor(0, 0, 0); doc.setFontSize(9); doc.setFont('helvetica', 'bold');
            doc.text(`BANCO ${bank}`, cardX + 5, y + 6);

            doc.setTextColor(100, 100, 100); doc.setFontSize(8); doc.setFont('helvetica', 'normal');
            doc.text(`Carga: ${(bLoad.ac + bLoad.dc).toFixed(2)} kW`, cardX + 5, y + 12);
            doc.text(`(AC:${bLoad.ac.toFixed(1)} DC:${bLoad.dc.toFixed(1)})`, cardX + 5, y + 17);

            doc.setTextColor(0, 0, 0); doc.setFontSize(14); doc.setFont('helvetica', 'bold');
            doc.text(fmtHours(aut), cardX + 83, y + 12, { align: 'right' });

            if (col === 1) { y += 28; col = 0; } else col = 1;
          });
          if (col === 1) y += 28;
        }

        doc.save(`${slugify(node.name)}-historial.pdf`);
        toast('PDF generado (Versión impresión)', 'success');
      };

      const exportXLSX = () => {
        // Hoja 1: Inspecciones y mediciones ordenadas por banco — carga por equipo + carga por banco + ATS
        const measRows = [];
        const inspRecs = records.filter(r => (r.type === 'inspeccion' || r.type === 'actualizacion_carga') && r.measurements && Object.keys(r.measurements).length > 0);
        inspRecs.forEach(r => {
          const fecha = fmtDate(r.date);
          const hora = r.date?.toDate ? r.date.toDate().toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' }) : '';
          const meas = r.measurements || {};
          // Reconstruir grupos ordenados
          const fakeEqs = sortEquipment(Object.keys(meas).map(tag => {
            const type = getEqTypeFromTag(tag, equipment);
            return { id: tag, tag, type, active: true };
          }));
          const groups = groupByBank(fakeEqs);
          groups.forEach(({ bank, eqs, bat, orphanBats }) => {
            let bankAcW = 0, bankDcW = 0;
            // Equipos del grupo
            eqs.forEach(eq => {
              const vals = meas[eq.tag] || {};
              const load = calcLoad(eq.type, vals);
              bankAcW += load.ac; bankDcW += load.dc;
              const aggLoad = load.ac + load.dc;
              const row = { 'Fecha': fecha, 'Hora': hora, 'Banco': bank || '—', 'Equipo': eq.tag, 'Tipo': eq.type, 'Carga (kW)': aggLoad > 0 ? aggLoad.toFixed(3) : '' };
              // ATS: L1, L2, N
              if (eq.type === 'ATS') { row['L1 (A)'] = vals.L1 || ''; row['L2 (A)'] = vals.L2 || ''; row['N (A)'] = vals.N || ''; }
              measRows.push(row);
            });
            // Banco BAT con V banco
            const totalGrpW = bankAcW + bankDcW;
            const batEq = bat ? (equipment.find(e => e.tag === bat.tag) || bat) : (equipment.find(e => e.type === 'BAT' && getBankId(e.tag) === bank) || null);
            if (batEq) {
              const vals = (bat && meas[bat.tag]) ? meas[bat.tag] : {};
              const aut = totalGrpW > 0 ? calcAutonomy(batEq, bankAcW, bankDcW) : null;
              measRows.push({
                'Fecha': fecha, 'Hora': hora, 'Banco': bank || '—', 'Equipo': batEq.tag, 'Tipo': 'BAT',
                'Carga (kW)': '', 'V Banco (VDC)': vals.V_banco || '', 'I Banco (A)': vals.I_banco || '',
                'Autonomía (h)': aut ? aut.toFixed(2) : ''
              });
            }
            // Carga total del banco
            if (bank && bank !== '_ats' && totalGrpW > 0) {
              measRows.push({ 'Fecha': fecha, 'Hora': hora, 'Banco': bank, 'Equipo': '→ TOTAL BANCO', 'Tipo': '', 'Carga (kW)': totalGrpW.toFixed(3) });
            }
          });
        });
        // Hoja 2: Resumen
        const recRows = inspRecs.map(r => ({
          'Fecha': fmtDate(r.date),
          'Hora': r.date?.toDate ? r.date.toDate().toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' }) : '',
          'Turno': r.shift === 'dia' ? 'Día' : 'Noche',
          'Observaciones': r.observations || '',
        }));
        const eqRows = equipment.map(e => ({
          'Tag': e.tag, 'Tipo': e.type,
          'Tensión AC': e.voltage || '',
          'Tensión DC': e.voltageDC || '',
          'Panel Solar': e.hasSolar ? 'Sí' : 'No', 'Batería': e.batteryType || '',
          'Capacidad (Ah)': e.batCapacity || '', 'N° Baterías': (e.batCount ? (e.batteryType === 'NMC' ? `${e.batCount} celdas (${Math.floor(e.batCount / 7)} bat.)` : `${e.batCount}`) : ''), 'Tipo Celda': e.batCellType || '',
          'Estado': e.active !== false ? 'Activo' : 'Retirado',
          'Instalado': fmtDate(e.installedAt), 'Instalado por': e.installedBy || '',
          'Notas': e.notes || '',
        }));
        // Hoja 4: Historial de Cargas (Matriz de bancos)
        const histRows = inspRecs.map(r => {
          const row = { 'Fecha': fmtDate(r.date), 'Hora': r.date?.toDate ? r.date.toDate().toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' }) : '' };
          let totalNodo = 0;
          Object.entries(r.measurements || {}).forEach(([tag, vals]) => {
            const type = getEqTypeFromTag(tag, equipment);
            const ld = calcLoad(type, vals);
            const lTot = ld.ac + ld.dc;
            totalNodo += lTot;
            const b = getBankId(tag);
            if (b) {
              const k = `Banco ${b} (kW)`;
              row[k] = parseFloat(((row[k] || 0) + lTot).toFixed(3));
            }
          });
          row['TOTAL NODO (kW)'] = totalNodo.toFixed(3);
          return row;
        });

        const wb = XLSX.utils.book_new();
        if (histRows.length) {
          const wsHist = XLSX.utils.json_to_sheet(histRows);
          XLSX.utils.book_append_sheet(wb, wsHist, 'Historial Cargas');
        }
        if (measRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(measRows), 'Inspecciones');
        if (recRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(recRows), 'Resumen');
        XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(eqRows), 'Equipos');
        XLSX.writeFile(wb, `${slugify(node.name)}-datos.xlsx`);
        toast('Excel generado', 'success');
      };

      const tc = NODE_TYPES[node.type] || { label: '—', color: '#64748b' };
      const filtered = filterType === 'all' ? records : records.filter(r => r.type === filterType);
      const canWrite = userProfile.role === 'tecnico' || userProfile.role === 'admin' || userProfile.role === 'supervisor';

      if (subView === 'newRecord') return <RecordForm nodeId={node.id} nodeName={node.name} equipment={equipment} userProfile={userProfile} onSave={() => setSubView('main')} onCancel={() => setSubView('main')} toast={toast} />;
      if (subView === 'recordDetail' && selRecord) return <RecordDetail record={selRecord} nodeId={node.id} nodeName={node.name} equipment={equipment} userProfile={userProfile} onBack={() => setSubView('main')} toast={toast} />;

      const saveEditEq = async (data) => {
        try {
          const updateData = { ...data };
          if (typeof updateData.notes === 'string') updateData.notes = sanitize(updateData.notes);
          if (typeof updateData.capacity === 'string') updateData.capacity = sanitize(updateData.capacity);
          if (typeof updateData.phases === 'string') updateData.phases = sanitize(updateData.phases);
          if (typeof updateData.voltage === 'string') updateData.voltage = sanitize(updateData.voltage);
          if (typeof updateData.voltageDC === 'string') updateData.voltageDC = sanitize(updateData.voltageDC);
          if (typeof updateData.serial === 'string') updateData.serial = sanitize(updateData.serial);
          if (typeof updateData.tag === 'string') updateData.tag = sanitize(updateData.tag);
          if (typeof updateData.batteryType === 'string') updateData.batteryType = sanitize(updateData.batteryType);
          if (typeof updateData.batCapacity === 'string') updateData.batCapacity = sanitize(updateData.batCapacity);
          if (typeof updateData.batCount === 'string') updateData.batCount = sanitize(updateData.batCount);
          if (typeof updateData.batCellType === 'string') updateData.batCellType = sanitize(updateData.batCellType);

          if (!updateData.notes || (typeof updateData.notes === 'string' && updateData.notes.trim() === '')) {
            updateData.notes = firebase.firestore.FieldValue.delete();
          }
          if (!updateData.batCapacity || String(updateData.batCapacity).trim() === '') {
            updateData.batCapacity = firebase.firestore.FieldValue.delete();
          }
          if (!updateData.batCount || String(updateData.batCount).trim() === '') {
            updateData.batCount = firebase.firestore.FieldValue.delete();
          }
          // For GEN: preserve capacity and phases
          if (editEq.type === 'GEN') {
            if (!updateData.capacity || String(updateData.capacity).trim() === '') updateData.capacity = firebase.firestore.FieldValue.delete();
            if (!updateData.phases || String(updateData.phases).trim() === '') updateData.phases = firebase.firestore.FieldValue.delete();
          }
          await db.collection('energy_nodes').doc(node.id).collection('energy_equipment').doc(editEq.id).update(updateData);
          toast('Equipo actualizado.', 'success');
          setEditEq(null);
        } catch (e) { toast('Error al guardar.', 'error'); }
      };

      return (
        <div className="fin">
          {qrOpen && <QRModal node={node} onClose={() => setQrOpen(false)} />}
          {editEq && <EditEqModal eq={editEq} userProfile={userProfile} onSave={saveEditEq} onClose={() => setEditEq(null)} 
            onDelete={async (id) => {
              try {
                await db.collection('energy_nodes').doc(node.id).collection('energy_equipment').doc(id).delete();
                toast('Equipo eliminado.', 'success');
                setEditEq(null);
              } catch (e) { toast('Error: ' + e.message, 'error'); }
            }} 
          />}

          {/* Header */}
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 16, gap: 12 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <button onClick={onBack} style={{ background: 'none', border: 'none', color: 'var(--tx3)', cursor: 'pointer', fontSize: 22, flexShrink: 0 }}>←</button>
              <div>
                <h2 className="fd" style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--tx1)', lineHeight: 1.2 }}>{node.name}</h2>
                <div style={{ display: 'flex', gap: 8, marginTop: 5, flexWrap: 'wrap', alignItems: 'center' }}>
                  <span className="badge" style={{ background: tc.color + '22', color: tc.color }}>{tc.label}</span>
                  <span style={{ color: 'var(--tx3)', fontSize: '.8rem' }}><IconMapPin size={14} />{node.zone}</span>
                </div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
              <button className="bs" style={{ padding: '6px 12px', fontSize: '.78rem' }} onClick={() => setQrOpen(true)}>QR</button>
              {canWrite && <button className="bp" style={{ padding: '7px 14px', fontSize: '.8rem' }} onClick={() => setSubView('newRecord')}>+ Registro</button>}
            </div>
          </div>

          {/* Stats */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10, marginBottom: 16 }}>
            {[
              { label: 'Equipos Activos', val: equipment.filter(e => e.active !== false).length, c: '#008000' },
              { label: 'Registros', val: records.length, c: '#0166ff' },
              { label: 'Última Visita', val: records[0] ? fmtDate(records[0].date) : '—', c: '#0166ff', sm: true },
            ].map(s => (
              <div key={s.label} style={{ background: 'var(--bg-surface)', border: '1px solid var(--border)', borderRadius: 8, padding: '10px 13px' }}>
                <div style={{ fontSize: '.68rem', color: 'var(--tx3)', textTransform: 'uppercase', letterSpacing: '.05em', fontFamily: "'Outfit', 'Montserrat', sans-serif", marginBottom: 4 }}>{s.label}</div>
                <div className={s.sm ? '' : 'fm'} style={{ fontSize: s.sm ? '.85rem' : '1.4rem', fontWeight: 700, color: s.c }}>{s.val}</div>
              </div>
            ))}
          </div>

          {/* Tabs */}
          <div style={{ borderBottom: '1px solid var(--border)', marginBottom: 16, display: 'flex', overflowX: 'auto' }}>
            {[['equipos', 'Equipos'], ['plantas', 'Plantas Eléctricas'], ['historial', 'Historial'], ['cargas', 'Cargas'], ['docs', 'Docs'], ['alertas', 'Alertas'], ['eventos', 'Eventos'], ['exportar', 'Exportar']].map(([k, lbl]) => (
              <button key={k} className={`tab ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)} style={{ whiteSpace: 'nowrap' }}>{lbl}</button>
            ))}
          </div>

          {/* TAB EQUIPOS */}
          {tab === 'equipos' && (
            <div>
              {loading ? <div style={{ color: 'var(--tx3)', textAlign: 'center', padding: 50 }}>Cargando equipos...</div>
                : equipment.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: 50 }}>
                    <p style={{ color: 'var(--tx3)', marginBottom: 14 }}>No hay equipos registrados en este nodo.</p>
                    {canWrite && <button className="bp" onClick={() => setSubView('newRecord')}>Registrar Instalación</button>}
                  </div>
                ) : ['active', 'retired'].map(status => {
                  const eqs = sortEquipment(equipment.filter(e => status === 'active' ? e.active !== false : e.active === false));
                  if (!eqs.length) return null;
                  return (
                    <div key={status} style={{ marginBottom: 16 }}>
                      <div style={{ fontSize: '.72rem', color: 'var(--tx3)', textTransform: 'uppercase', letterSpacing: '.08em', marginBottom: 8, fontFamily: "'Outfit', 'Montserrat', sans-serif" }}>
                        {status === 'active' ? 'Activos' : 'Retirados'}
                      </div>
                      {eqs.map(eq => {
                        const ti = EQ_TYPES[eq.type] || EQ_TYPES.OTR;
                        return (
                          <div key={eq.id} className="card" style={{ marginBottom: 8, border: '1px solid var(--border)', opacity: status === 'retired' ? .5 : 1 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                              <span className="badge" style={{ background: ti.bg, color: ti.color }}>{eq.type}</span>
                              <span className="fm" style={{ fontSize: '.92rem', fontWeight: 600, color: 'var(--tx1)' }}>{eq.tag}</span>
                              {(eq.type === 'INV' || eq.type === 'ATS') && eq.voltage && <span style={{ color: 'var(--tx3)', fontSize: '.74rem' }}>{eq.voltage}</span>}
                              {(eq.type === 'BAT' || eq.type === 'ETP') && eq.voltageDC && <span style={{ color: 'var(--tx3)', fontSize: '.74rem' }}>{eq.voltageDC} VDC</span>}
                              {eq.hasAcIn && <span style={{ color: '#0166ff', fontSize: '.73rem' }}>AC/IN</span>}
                              {eq.hasAcOut && <span style={{ color: '#008000', fontSize: '.73rem' }}>AC/OUT</span>}
                              {eq.hasDcOut && <span style={{ color: '#21c0fa', fontSize: '.73rem' }}>DC/OUT</span>}
                              {eq.hasSolar && <span style={{ color: '#0166ff', fontSize: '.73rem' }}>PV</span>}
                              {eq.type === 'ETP' && eq.solarRegPercentage && <span style={{ color: '#0166ff', fontSize: '.73rem' }}>{eq.solarRegPercentage}%</span>}
                              {eq.batteryType && eq.batteryType !== 'No aplica' && <span style={{ color: '#21c0fa', fontSize: '.73rem' }}>{eq.batteryType}</span>}
                              {eq.batCapacity && <span style={{ color: '#21c0fa', fontSize: '.73rem' }}>{eq.batCapacity}Ah</span>}
                              {eq.batCount && <span style={{ color: '#21c0fa', fontSize: '.73rem' }}>
                                {eq.batteryType === 'NMC' ? `${eq.batCount} celdas (${Math.floor(eq.batCount / 7)} bat.)` : `${eq.batCount} bat.`}
                              </span>}
                              {eq.batCellType && eq.batCellType !== 'No aplica' && <span style={{ color: '#64748b', fontSize: '.73rem' }}>{eq.batCellType}</span>}
                              {eq.type === 'GEN' && eq.capacity && <span style={{ color: '#eab308', fontSize: '.73rem', fontWeight: 700 }}>{eq.capacity} KVA</span>}
                              {eq.type === 'GEN' && eq.phases && <span style={{ color: '#eab308', fontSize: '.73rem' }}>{eq.phases === 'Monofásica' ? '1Φ' : '3Φ'} {eq.phases}</span>}
                              <span style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 8 }}>
                                <span style={{ color: 'var(--tx4)', fontSize: '.72rem' }}>{fmtDate(eq.installedAt)}</span>
                                {canWrite && <button onClick={() => setEditEq(eq)}
                                  style={{ background: 'none', border: '1px solid var(--border)', color: 'var(--tx3)', padding: '2px 8px', borderRadius: 4, cursor: 'pointer', fontSize: '.72rem', fontFamily: "'Outfit', 'Montserrat', sans-serif" }}>
                                  Editar
                                </button>}
                              </span>
                            </div>
                            {eq.notes && <div style={{ marginTop: 6, fontSize: '.78rem', color: 'var(--tx3)' }}>{eq.notes}</div>}
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
            </div>
          )}

          {/* TAB PLANTAS */}
          {tab === 'plantas' && <NodePlantas nodeId={node.id} nodeName={node.name} equipment={equipment} records={records} userProfile={userProfile} toast={toast} onSubViewChange={setSubView} setSelRecord={setSelRecord} />}

          {/* TAB CARGAS */}
          {tab === 'cargas' && <LoadChart records={records} equipment={equipment} onExport={exportXLSX} />}

          {/* TAB DOCS */}
          {tab === 'docs' && <NodeDocs nodeId={node.id} userProfile={userProfile} toast={toast} />}

          {/* TAB HISTORIAL */}
          {tab === 'historial' && (
            <div>
              <div style={{ display: 'flex', gap: 6, marginBottom: 14, flexWrap: 'wrap' }}>
                {['all', ...Object.keys(REC_TYPES)].map(k => {
                  const rt = REC_TYPES[k];
                  const active = filterType === k;
                  return (
                    <button key={k} onClick={() => setFilterType(k)}

                        background: active ? (k === 'all' ? '#26262a' : (rt?.color || '#64748b')) : 'transparent',
                        borderColor: k === 'all' ? '#323236' : (rt?.color || '#64748b'),
                        color: active ? '#fff' : (k === 'all' ? 'var(--tx3)' : (rt?.color || '#64748b'))
                      }}>
                      {k === 'all' ? 'Todos' : rt.label}
                    </button>
                  );
                })}
              </div>
              {filtered.length === 0
                ? <div style={{ textAlign: 'center', padding: 40 }}><p style={{ color: 'var(--tx3)' }}>No hay registros{filterType !== 'all' ? ' de este tipo' : ''}.</p></div>
                : filtered.map(r => {
                  const rt = REC_TYPES[r.type] || { label: r.type, icon: '', color: '#64748b' };

                            <span className="fd" style={{ fontWeight: 700, fontSize: '.9rem', color: 'var(--tx1)' }}>{rt.label}</span>

                          <div style={{ fontSize: '.8rem', color: 'var(--tx3)' }}>{r.technicianName} · {fmtDate(r.date)}</div>
                          {r.observations && <div style={{ fontSize: '.76rem', color: 'var(--tx4)', marginTop: 4, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 260 }}>{r.observations}</div>}
                        </div>
                        <span style={{ color: 'var(--border-bright)', fontSize: 20 }}>›</span>

          {/* TAB ALERTAS */}
          {tab === 'alertas' && <NodeAlerts nodeId={node.id} nodeName={node.name} userProfile={userProfile} toast={toast} />}

          {/* TAB EVENTOS */}
          {tab === 'eventos' && <NodeEvents nodeId={node.id} nodeName={node.name} userProfile={userProfile} toast={toast} />}

          {confirmModal && (
            <ConfirmModal
              title={confirmModal.title}
              msg={confirmModal.msg}
              type={confirmModal.type}
              confirmText={confirmModal.confirmText}
              cancelText={confirmModal.cancelText}
              onConfirm={async () => {
                const fn = confirmModal.onConfirm;
                setConfirmModal(null);
                if (fn) await fn();
              }}
              onCancel={() => {
                const fn = confirmModal.onCancel;
                setConfirmModal(null);
                if (fn) fn();
              }}
            />
          )}

          {/* TAB EXPORTAR */}
          {tab === 'exportar' && (
            <div>
              <p style={{ color: 'var(--tx3)', fontSize: '.9rem', marginBottom: 20 }}>Exporta toda la información registrada de este nodo.</p>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 16 }}>
                {[
                  { label: 'PDF', desc: 'Reporte completo con mediciones, equipos e historial', fn: exportPDF, cls: 'bs', renderIcon: () => <IconPdf size={26} color="#ef4444" />, badgeBg: 'rgba(239, 68, 68, 0.12)' },
                  { label: 'Excel', desc: 'Tablas separadas: registros y equipos para análisis', fn: exportXLSX, cls: 'bs', renderIcon: () => <IconExcel size={26} color="#10b981" />, badgeBg: 'rgba(16, 185, 129, 0.12)' },
                ].map(x => (

    function IconSliders({ size = 18, color = "currentColor" }) {
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="4" y1="21" x2="4" y2="14" />
          <line x1="4" y1="10" x2="4" y2="3" />
          <line x1="12" y1="21" x2="12" y2="12" />
          <line x1="12" y1="8" x2="12" y2="3" />
          <line x1="20" y1="21" x2="20" y2="16" />
          <line x1="20" y1="12" x2="20" y2="3" />
          <line x1="1" y1="14" x2="7" y2="14" />
          <line x1="9" y1="8" x2="15" y2="8" />
          <line x1="17" y1="16" x2="23" y2="16" />
        </svg>
      );
    }

    function NodeList({ userProfile, toast }) {
      const [confirmModal, setConfirmModal] = useState(null);
      const [nodes, setNodes] = useState([]);
      const [loading, setLoading] = useState(true);
      const [sel, setSel] = useState(null);
      const [search, setSearch] = useState('');
      const [fType, setFType] = useState('all');
      const [showFilters, setShowFilters] = useState(false);
      const [fState, setFState] = useState('all');
      const [activeInspection, setActiveInspection] = useState(() => {
        try {
          const s = localStorage.getItem('airtek_active_inspection');
          return s ? JSON.parse(s) : null;
        } catch { return null; }
      });

      // Refrescar estado de borrador al volver a la pestaña
      useEffect(() => {
        const updateActive = () => {
          try {
            const s = localStorage.getItem('airtek_active_inspection');
            setActiveInspection(s ? JSON.parse(s) : null);
          } catch {}
        };
        window.addEventListener('focus', updateActive);
        document.addEventListener('visibilitychange', updateActive);
        return () => {
          window.removeEventListener('focus', updateActive);
          document.removeEventListener('visibilitychange', updateActive);
        };
      }, []);

      const resumeInspection = () => {
        if (!activeInspection) return;
        const node = nodes.find(n => n.id === activeInspection.nodeId);
        if (node) {
          setSel(node);
        } else {
          toast('No se encontró el nodo del borrador', 'warn');
        }
      };

      const discardActiveInspection = () => {
        try {
          if (activeInspection?.key) localStorage.removeItem(activeInspection.key);
          localStorage.removeItem('airtek_active_inspection');
          setActiveInspection(null);
          toast('Borrador descartado', 'info');
        } catch (e) {}
      };

      const isFiltered = search !== '' || fState !== 'all' || fType !== 'all';

      const resetFilters = () => {
        setSearch('');
        setFState('all');
        setFType('all');
      };

      useEffect(() => {
        const u = db.collection('energy_nodes').where('active', '==', true).onSnapshot(s => {
          setNodes(s.docs.map(d => ({ id: d.id, ...d.data() })));
          setLoading(false);
        });
        return u;
      }, []);

      // Deep link via ?node=id
      useEffect(() => {
        const p = new URLSearchParams(window.location.search);
        const nid = p.get('node');
        if (nid && nodes.length > 0) { const n = nodes.find(n => n.id === nid); if (n) setSel(n); }
      }, [nodes]);

      if (sel) return <NodeDetail node={sel} userProfile={userProfile} onBack={() => setSel(null)} toast={toast} />;

      const normalizeLoc = (loc) => {
        const l = (loc || '').trim().toLowerCase();
        if (l === 'falcon' || l === 'falcón') return 'Falcón';
        if (l === 'lara') return 'Lara';
        if (l === 'colombia') return 'Colombia';
        return 'Zulia';
      };

      const filtered = nodes.filter(n => {
        const ms = n.name.toLowerCase().includes(search.toLowerCase()) || (n.zone || '').toLowerCase().includes(search.toLowerCase());
        const loc = normalizeLoc(n.estado);
        let stateMatch = true;
        if (fState === 'all') {
          stateMatch = true;
        } else if (fState === 'Venezuela') {
          stateMatch = loc !== 'Colombia';
        } else if (fState === 'Colombia') {
          stateMatch = loc === 'Colombia';
        } else {
          stateMatch = loc.toLowerCase() === fState.toLowerCase() || (fState === 'Falcon' && loc === 'Falcón') || (fState === 'Falcón' && loc === 'Falcón');
        }
        return ms && (fType === 'all' || n.type === fType) && stateMatch;
      });

      return (
        <div className="fin">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20, flexWrap: 'wrap', gap: 12 }}>
            <div>
              <h1 className="fd" style={{ fontSize: '1.5rem', fontWeight: 800, color: 'var(--tx1)' }}>Sistema de Gestión de Energía</h1>
              <p style={{ color: 'var(--tx3)', fontSize: '.85rem' }}>{nodes.length} ubicaciones activas registradas en la red</p>
            </div>
          </div>
          {/* Banner de Borrador Activo */}
          {activeInspection && (
            <div style={{
              background: 'rgba(245, 158, 11, 0.12)',
              border: '1px solid rgba(245, 158, 11, 0.4)',
              borderRadius: 14,
              padding: '14px 18px',
              marginBottom: 20,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'space-between',
              flexWrap: 'wrap',
              gap: 12,
              boxShadow: 'var(--card-shadow)'
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <IconChecklist size={22} color="#f59e0b" />
                <div>
                  <div style={{ fontWeight: 700, color: '#f59e0b', fontSize: '.92rem' }}>
                    Inspección en progreso: {activeInspection.nodeName}
                  </div>
                  <div style={{ fontSize: '.78rem', color: 'var(--tx2)' }}>
                    {activeInspection.formType === 'plant' ? `Planta ${activeInspection.plantTag}` : 'Inspección general de equipos'} · Guardado local {activeInspection.savedAt ? new Date(activeInspection.savedAt).toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' }) : ''}
                  </div>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="bp" style={{ padding: '8px 16px', fontSize: '.82rem' }} onClick={resumeInspection}>
                  Continuar Inspección →
                </button>
                <button className="bs" style={{ padding: '8px 12px', fontSize: '.82rem', borderColor: 'rgba(239,68,68,.4)', color: '#ef4444' }} onClick={discardActiveInspection}>
                  Descartar
                </button>
              </div>
            </div>
          )}

          {/* Search Bar & Filter Button (Only Filter Button Visible Initially) */}
          <div style={{ display: 'flex', gap: 12, marginBottom: 16, alignItems: 'center' }}>
            <div style={{ position: 'relative', flex: 1, maxWidth: 380 }}>
              <span style={{
                position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)',
                color: 'var(--tx3)', display: 'flex', alignItems: 'center', pointerEvents: 'none'
              }}>
                <IconSearch size={17} />
              </span>
              <input 
                className="fi" 
                style={{ paddingLeft: 40, paddingRight: search ? 36 : 14, borderRadius: 24, height: 42 }} 
                placeholder="Buscar Datacenter, nodo o sede..." 
                value={search} 
                onChange={e => setSearch(e.target.value)} 
              />
              {search && (
                <button 
                  onClick={() => setSearch('')}
                  style={{
                    position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)',
                    background: 'none', border: 'none', color: 'var(--tx3)', cursor: 'pointer', fontSize: 15,
                    display: 'flex', alignItems: 'center', justifyContent: 'center'
                  }}
                >
                  ✕
                </button>
              )}
            </div>

            <button
              onClick={() => setShowFilters(!showFilters)}
              title="Filtros de búsqueda"
              style={{
                width: 42,
                height: 42,
                borderRadius: '50%',
                background: (showFilters || isFiltered) ? 'rgba(1, 102, 255, 0.12)' : 'var(--bg-surface)',
                border: '1px solid',
                borderColor: (showFilters || isFiltered) ? 'var(--primary)' : 'var(--border)',
                color: (showFilters || isFiltered) ? 'var(--primary)' : 'var(--tx2)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                cursor: 'pointer',
                transition: 'all 0.2s ease',
                flexShrink: 0
              }}
            >
              <IconSliders size={19} />
            </button>
          </div>

          {/* Expandable Filter Drawer */}
          {(showFilters || isFiltered) && (
            <div 
              className="fin"
              style={{ 
                marginBottom: 20, 
                padding: '14px 16px', 
                background: 'var(--bg-surface)', 
                border: '1px solid var(--border)', 
                borderRadius: '16px', 
                display: 'flex', 
                alignItems: 'center', 
                gap: 14, 
                flexWrap: 'wrap' 
              }}
            >
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: '.8rem', color: 'var(--tx3)', fontWeight: 600 }}>Ubicación:</span>
                <select 
                  className="fi" 
                  style={{ width: 180, borderRadius: 20, height: 38, padding: '0 12px' }} 
                  value={fState} 
                  onChange={e => setFState(e.target.value)}
                >
                  <option value="all">Todas las ubicaciones</option>
                  <optgroup label="Venezuela">
                    <option value="Venezuela">Toda Venezuela</option>
                    <option value="Zulia">Zulia</option>
                    <option value="Falcón">Falcón</option>
                    <option value="Lara">Lara</option>
                  </optgroup>
                  <optgroup label="Colombia">
                    <option value="Colombia">Colombia</option>
                  </optgroup>
                </select>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <span style={{ fontSize: '.8rem', color: 'var(--tx3)', fontWeight: 600 }}>Tipo:</span>
                <div className="segmented-control">
                  {['all', ...Object.keys(NODE_TYPES)].map(t => {
                    const nt = NODE_TYPES[t];
                    const on = fType === t;
                    return (
                      <button 
                        key={t} 
                        onClick={() => setFType(t)}
                        className={`segmented-btn ${on ? 'active' : ''}`}
                      >
                        {t === 'all' ? 'Todos los nodos' : nt.label.toLowerCase()}
                      </button>
                    );
                  })}
                </div>
              </div>

              {isFiltered && (
                <button
                  onClick={resetFilters}
                  style={{
                    marginLeft: 'auto',
                    background: 'rgba(245, 91, 93, 0.1)',
                    border: '1px solid rgba(245, 91, 93, 0.3)',
                    color: '#f55b5d',
                    fontSize: '.78rem',
                    fontWeight: 600,
                    padding: '6px 14px',
                    borderRadius: 20,
                    cursor: 'pointer',
                    transition: 'all 0.2s ease',
                    display: 'inline-flex',
                    alignItems: 'center',
                    gap: 4
                  }}
                >
                  Limpiar filtro
                </button>
              )}
            </div>
          )}
          {loading ? <div style={{ color: 'var(--tx3)', textAlign: 'center', padding: 70 }}>Cargando nodos...</div>
            : filtered.length === 0 ? <div style={{ color: 'var(--tx3)', textAlign: 'center', padding: 70 }}>No se encontraron nodos.</div>
              : (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(270px,1fr))', gap: 12 }}>
                  {filtered.map(n => {
                    const tc = NODE_TYPES[n.type] || { label: '—', color: '#64748b' };
                    return (
                      <div key={n.id} className="card ncard" style={{ cursor: 'pointer', border: '1px solid var(--border)' }}
                        onClick={() => setSel(n)}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                          <span className="badge" style={{ background: tc.color + '22', color: tc.color }}>{tc.label}</span>
                          <span style={{ color: 'var(--border-bright)', fontSize: 20 }}>›</span>
                        </div>
                        <div className="fd" style={{ fontSize: '1rem', fontWeight: 700, color: 'var(--tx1)', marginBottom: 4, lineHeight: 1.3 }}>{n.name}</div>
                        <div style={{ color: 'var(--tx4)', fontSize: '.8rem' }}><IconMapPin size={14} />{n.zone}</div>
                      </div>
                    );
                  })}
                </div>
              )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // AGREGAR USUARIO EXISTENTE
    // ═══════════════════════════════════════════════════
    function AddExistingUser({ toast, userProfile }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="card" style={{ marginBottom: 16, borderColor: 'rgba(1, 102, 255,.25)', background: 'rgba(1, 102, 255,.04)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }} onClick={() => setOpen(!open)}>
            <h3 className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: '#0166ff', textTransform: 'uppercase', letterSpacing: '.1em' }}>
              Agregar Usuario Existente de Firebase
            </h3>
            <span style={{ color: '#0166ff', fontSize: 18 }}>{open ? '▲' : '▼'}</span>
          </div>
          {open && (
            <div style={{ marginTop: 14 }}>
              <div style={{ background: 'rgba(1, 102, 255,.08)', borderRadius: 8, padding: '10px 14px', marginBottom: 14, fontSize: '.82rem', color: 'var(--tx3)', lineHeight: 1.6 }}>
                Para usuarios que ya tienen cuenta en otras apps del mismo proyecto Firebase.<br />
                <b style={{ color: '#0166ff' }}>Cómo obtener el UID:</b> Firebase Console → Authentication → Users → copia el User UID del usuario.
              </div>
              <UID_AddForm toast={toast} userProfile={userProfile} onDone={() => setOpen(false)} />
            </div>
          )}
        </div>
      );
    }

    function UID_AddForm({ toast, userProfile, onDone }) {
      const [uid, setUid] = useState('');
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('tecnico');
      const [loading, setLoading] = useState(false);

      const save = async () => {
        if (!uid.trim() || !name.trim()) { toast('UID y nombre son requeridos.', 'error'); return; }
        setLoading(true);
        try {
          const legacyRef = db.collection('energy_users').doc(uid.trim());
          const unifiedRef = db.collection('airtek_users').doc(uid.trim());
          const [existingLegacy, existingUnified] = await Promise.all([legacyRef.get(), unifiedRef.get()]);
          if (existingLegacy.exists && existingUnified.exists) { toast('Este UID ya tiene perfil en el sistema.', 'warn'); setLoading(false); return; }
          const profileData = { name: name.trim(), email: email.trim().toLowerCase(), role, approved: true, createdAt: TS() };
          // Escribir en ambas colecciones para compatibilidad cruzada
          if (!existingUnified.exists) await unifiedRef.set({ ...profileData, apps: { nodos: role, pm: null, almacen: null } });
          if (!existingLegacy.exists) await legacyRef.set(profileData);
          toast('Usuario agregado exitosamente. Ya puede ingresar en cualquier app con su contraseña.', 'success');
          setUid(''); setName(''); setEmail(''); setRole('tecnico');
          onDone();
        } catch (e) { console.error(e); toast('Error: ' + e.message, 'error'); }
        setLoading(false);
      };

      return (
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          <div style={{ gridColumn: '1/-1' }}>

    function PlantasExcelSync({ nodes, toast, userProfile }) {
      const [loading, setLoading] = useState(false);
      const [log, setLog] = useState([]);

      const handleImport = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setLoading(true);
        setLog(["Leyendo archivo Excel..."]);

        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });
            const sheetName = workbook.SheetNames.find(n => n.includes('MANTTO 2026')) || workbook.SheetNames[0];
            setLog(prev => [...prev, `Hoja seleccionada: "${sheetName}"`]);
            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });

            let headerIdx = -1;
            for (let r = 0; r < rows.length; r++) {
              if (rows[r]) {
                const hasPlanta = rows[r].some(cell => String(cell || '').toLowerCase().includes('planta'));
                const hasFuncionamiento = rows[r].some(cell => String(cell || '').toLowerCase().includes('funcionamiento'));
                if (hasPlanta && hasFuncionamiento) {
                  headerIdx = r;
                  break;
                }
              }
            }

            if (headerIdx === -1) {
              setLog(prev => [...prev, "Error: No se encontró la fila de cabecera con las columnas 'planta' y 'horas de funcionamiento'."]);
              setLoading(false);
              return;
            }

            const headers = rows[headerIdx].map(h => String(h || '').trim().toLowerCase());
            const colPlanta = headers.findIndex(h => h.includes('planta'));
            const colHoras = headers.findIndex(h => h.includes('funcionamiento')); // horas de funcionamiento al momento del cambio
            const colProximo = headers.findIndex(h => h.includes('proximo') || h.includes('próximo') || h.includes('cabio') || h.includes('cambio')); // proximo cabio de aceite
            const colTrabajadas = headers.findIndex(h => h.includes('trabajadas')); // horas trabajadas

            if (colPlanta === -1 || colHoras === -1) {
              setLog(prev => [...prev, "Error: Faltan las columnas requeridas 'planta' o 'horas de funcionamiento...'."]);
              setLoading(false);
              return;
            }

            const excelData = [];
            for (let r = headerIdx + 1; r < rows.length; r++) {
              const row = rows[r];
              if (!row || !row[colPlanta]) continue;
              const name = String(row[colPlanta]).trim();
              const lastMaintH = parseHours(row[colHoras]);
              const nextMaintH = colProximo !== -1 ? parseHours(row[colProximo]) : 0;
              const currentH = colTrabajadas !== -1 ? parseHours(row[colTrabajadas]) : lastMaintH;
              if (lastMaintH > 0 || currentH > 0) {
                excelData.push({ name, lastMaintH, nextMaintH, currentH });
              }
            }

            setLog(prev => [...prev, `Encontradas ${excelData.length} plantas con registros en Excel. Iniciando comparación...`]);

            let updatedCount = 0;
            let logBuffer = [];

            for (const n of nodes) {
              const nId = n.id;
              const nName = n.name || '';
              
              const equipSnap = await db.collection('energy_nodes').doc(nId).collection('energy_equipment')
                .where('type', '==', 'GEN').get();

              for (const eqDoc of equipSnap.docs) {
                const eqData = eqDoc.data();
                if (eqData.active === false) continue;
                const tag = (eqData.tag || '').trim().toLowerCase();
                const serial = (eqData.serial || '').trim().toLowerCase();

                const match = excelData.find(u => {
                  const uName = u.name.toLowerCase();
                  return tag === uName || tag.includes(uName) || uName.includes(tag) ||
                         (serial && (serial === uName || serial.includes(uName) || uName.includes(serial))) ||
                         (nName.toLowerCase().includes(uName) || uName.includes(nName.toLowerCase()));
                });

                if (match) {
                  const oldHorometer = parseFloat(eqData.horometer) || 0;
                  const oldLastMaint = parseFloat(eqData.lastMaintenanceHorometer) || 0;
                  const interval = parseFloat(eqData.maintenanceInterval) || 250;
                  const newInterval = match.nextMaintH > match.lastMaintH ? Math.round(match.nextMaintH - match.lastMaintH) : interval;

                  const updateObj = {
                    lastMaintenanceHorometer: match.lastMaintH,
                    maintenanceInterval: newInterval
                  };

                  let horometerUpdated = false;
                  if (!eqData.horometer || oldHorometer < match.currentH) {
                    updateObj.horometer = match.currentH;
                    horometerUpdated = true;
                  }

                  await db.collection('energy_nodes').doc(nId).collection('energy_equipment').doc(eqDoc.id).update(updateObj);
                  updatedCount++;
                  
                  let logMsg = `Match: Excel "${match.name}" -> BD Tag "${eqData.tag}" (Nodo: ${nName}). `;
                  logMsg += `Último Mantt: ${formatHHMMSS(oldLastMaint)} -> ${formatHHMMSS(match.lastMaintH)}. `;
                  if (horometerUpdated) {
                    logMsg += `Horómetro: ${formatHHMMSS(oldHorometer)} -> ${formatHHMMSS(match.currentH)}. `;
                  } else {
                    logMsg += `Horómetro: ${formatHHMMSS(oldHorometer)} (sin cambios, Excel: ${formatHHMMSS(match.currentH)}). `;
                  }
                  logMsg += `Intervalo: ${newInterval}H.`;
                  logBuffer.push(logMsg);
                }
              }
            }

            setLog(prev => [
              ...prev,
              ...logBuffer,
              `Sincronización completada: ${updatedCount} plantas eléctricas actualizadas exitosamente en Firebase.`
            ]);
            toast(`Sincronización finalizada. ${updatedCount} plantas actualizadas.`, 'success');

          } catch (err) {
            console.error(err);
            setLog(prev => [...prev, `Error: ${err.message}`]);
            toast('Error al sincronizar plantas.', 'error');
          } finally {
            setLoading(false);
          }
        };
        reader.readAsBinaryString(file);
      };

      return (
        <div className="card" style={{ background: 'var(--bg-surface)', border: '1px solid var(--border)', borderRadius: 10, padding: 20 }}>
          <h3 className="fd" style={{ fontSize: '1rem', fontWeight: 700, color: 'var(--amber)', marginBottom: 10 }}>
            Sincronizar Mantenimientos desde Excel
          </h3>
          <p style={{ color: 'var(--tx2)', fontSize: '.82rem', marginBottom: 16 }}>
            Selecciona el archivo <code className="fm">MANTTO DE LAS PLANTAS.xlsx</code> para sincronizar automáticamente el horómetro actual y del último mantenimiento de la hoja <code className="fm">MANTTO 2026</code>.
          </p>

          <div style={{ marginBottom: 18 }}>
            <label className="bp" style={{ display: 'inline-block', padding: '9px 18px', borderRadius: 8, cursor: 'pointer', fontSize: '.85rem' }}>
              {loading ? 'Procesando...' : 'Cargar Excel'}
              <input type="file" accept=".xlsx" onChange={handleImport} disabled={loading} style={{ display: 'none' }} />
            </label>
          </div>

          {log.length > 0 && (
            <div style={{ background: 'rgba(0,0,0,0.2)', border: '1px solid var(--border)', borderRadius: 8, padding: 14, maxHeight: 300, overflowY: 'auto' }}>
              <div style={{ fontSize: '.7rem', color: 'var(--tx3)', textTransform: 'uppercase', marginBottom: 8, fontWeight: 700 }}>Historial de Sincronización</div>
              {log.map((line, idx) => (
                <div key={idx} className="fm" style={{ fontSize: '.76rem', color: line.startsWith('Error:') ? 'var(--red)' : line.startsWith('Sincronización') ? 'var(--green)' : 'var(--tx2)', marginBottom: 4, lineHeight: 1.4 }}>
                  {line}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function AdminPanel({ userProfile, toast }) {
      const [confirmModal, setConfirmModal] = useState(null);
      const [tab, setTab] = useState('nodos');
      const [users, setUsers] = useState([]);
      const [nodes, setNodes] = useState([]);
      const [ldU, setLdU] = useState(true);
      const [ldN, setLdN] = useState(true);
      const [newNode, setNN] = useState({ name: '', zone: '', type: 'fibra', estado: 'Zulia' });
      const [editNodeId, setEditNodeId] = useState(null);
      const [editNodeData, setEditNodeData] = useState({});
      const [seeding, setSeeding] = useState(false);
      const [selNodeId, setSelNodeId] = useState('');
      const [bulkText, setBulkText] = useState('');
      const [bulkParsed, setBulkParsed] = useState([]);
      const [bulkLoading, setBulkLoading] = useState(false);

      const [userLoadError, setUserLoadError] = useState('');

      // Función para cargar/refrescar usuarios combinando ambas colecciones
      const loadUsers = () => {
        setLdU(true);
        setUserLoadError('');
        Promise.allSettled([
          db.collection('airtek_users').get(),
          db.collection('energy_users').get()
        ]).then(([unifiedResult, legacyResult]) => {
          const map = new Map();
          let anySuccess = false;
          if (unifiedResult.status === 'fulfilled') {
            anySuccess = true;
            unifiedResult.value.docs.forEach(d => map.set(d.id, {
              id: d.id, ...d.data(),
              role: (d.data().apps && d.data().apps.nodos) || d.data().role || 'tecnico',
              name: d.data().name || d.data().nombre || ''
            }));
          } else { console.warn('airtek_users no accesible:', unifiedResult.reason?.code); }
          if (legacyResult.status === 'fulfilled') {
            anySuccess = true;
            legacyResult.value.docs.forEach(d => { if (!map.has(d.id)) map.set(d.id, { id: d.id, ...d.data() }); });
          } else { console.error('energy_users error:', legacyResult.reason); }
          if (!anySuccess) setUserLoadError('No se pudieron cargar los usuarios. Verifica los permisos de Firestore.');
          setUsers([...map.values()]);
          setLdU(false);
        });
      };

      useEffect(() => {
        loadUsers();
        // Listener en tiempo real para energy_users (legacy) — detecta nuevos registros
        const u1 = db.collection('energy_users').onSnapshot(snap => {
          // Refrescar cuando cambie energy_users
          loadUsers();
        }, err => console.warn('energy_users listener error:', err.code));
        const n = db.collection('energy_nodes').onSnapshot(s => { setNodes(s.docs.map(d => ({ id: d.id, ...d.data() }))); setLdN(false); });
        return () => { u1(); n(); };
      }, []);

      const parseBulk = txt => {
        const lines = txt.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
        const parsed = lines.map((line, i) => {
          const parts = line.split('|').map(p => p.trim());
          const tag = parts[0] || '';
          const typeRaw = (parts[1] || '').toUpperCase();
          const type = Object.keys(EQ_TYPES).includes(typeRaw) ? typeRaw : 'OTR';
          const voltage = parts[2] || '220V';
          const batRaw = (parts[3] || '').toUpperCase();
          const batteryType = BAT_TYPES.find(b => b.toUpperCase() === batRaw) || 'No aplica';
          const hasSolar = ['SI', 'SÍ', 'YES', 'S', '1', 'TRUE'].includes((parts[4] || '').toUpperCase().trim());
          // notes handled below with bank fields
          const batCapacity = parts[5] || '';
          const batCount = parts[6] || '';
          const batCellRaw = (parts[7] || '').trim();
          const batCellType = ['Prismática', 'Cilíndrica', 'Pouch'].find(c => c.toLowerCase() === batCellRaw.toLowerCase()) || 'No aplica';
          const notes = parts[8] || parts[5] || ''; // fallback for old 6-col format
          return { tag, type, voltage, batteryType, hasSolar, batCapacity, batCount, batCellType, notes, valid: !!tag, _line: i + 1 };
        });
        setBulkParsed(parsed);
      };

      const importEquipment = async () => {
        if (!selNodeId) { toast('Selecciona un nodo primero.', 'error'); return; }
        const valid = bulkParsed.filter(e => e.valid);
        if (!valid.length) { toast('No hay equipos válidos para importar.', 'error'); return; }
        const isRealAdmin = await verifyAdminRole(userProfile);
        if (!isRealAdmin) { toast('No tienes permisos de administrador.', 'error'); return; }
        setBulkLoading(true);
        try {
          const batch = db.batch();
          valid.forEach(eq => {
            const ref = db.collection('energy_nodes').doc(selNodeId).collection('energy_equipment').doc();
            const { _line, valid: _v, ...data } = eq;
            const cleanData = {
              tag: sanitize(data.tag || ''),
              type: sanitize(data.type || ''),
              voltage: sanitize(data.voltage || ''),
              batteryType: sanitize(data.batteryType || ''),
              hasSolar: !!data.hasSolar,
              batCapacity: sanitize(data.batCapacity || ''),
              batCount: sanitize(data.batCount || ''),
              batCellType: sanitize(data.batCellType || 'No aplica'),
              notes: sanitize(data.notes || '')
            };
            batch.set(ref, { ...cleanData, active: true, installedAt: new Date(), installedBy: sanitize(userProfile.name), createdAt: TS() }, { merge: true });
          });
          await batch.commit();
          toast(valid.length + ' equipos importados.', 'success');
          setBulkText(''); setBulkParsed([]); setSelNodeId('');
        } catch (e) { console.error(e); toast('Error al importar.', 'error'); }
        setBulkLoading(false);
      };

      const approve = async (uid, val, role) => {

        // Actualizar en ambas colecciones (la que exista)

        try {
          await Promise.allSettled([

          toast(val ? 'Usuario aprobado.' : 'Acceso revocado.', 'success');
          loadUsers(); // Refrescar lista
        } catch (e) { toast('Error al actualizar: ' + e.message, 'error'); }
      };

      const addNode = async () => {
        if (!newNode.name) { toast('Ingresa el nombre del nodo.', 'error'); return; }
        const isRealAdmin = await verifyAdminRole(userProfile);
        if (!isRealAdmin) { toast('No tienes permisos de administrador.', 'error'); return; }
        await db.collection('energy_nodes').add({
          name: sanitize(newNode.name),
          zone: sanitize(newNode.zone),
          estado: sanitize(newNode.estado || 'Zulia'),

          active: true,
          createdAt: TS()

        toast('Nodo agregado.', 'success');

      const saveNodeEdit = async (id) => {

    function ChangePasswordModal({ onClose, toast }) {
      const [cur, setCur] = useState('');
      const [p1, setP1] = useState('');
      const [p2, setP2] = useState('');
      const [loading, setLoading] = useState(false);

      const save = async () => {
        if (!cur || !p1 || !p2) { toast('Completa todos los campos.', 'error'); return; }
        if (p1 !== p2) { toast('Las contraseñas nuevas no coinciden.', 'error'); return; }
        if (p1.length < 6) { toast('La contraseña debe tener al menos 6 caracteres.', 'error'); return; }
        setLoading(true);
        try {
          const user = auth.currentUser;
          const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
          await user.reauthenticateWithCredential(cred);
          await user.updatePassword(p1);
          toast('Contraseña actualizada exitosamente.', 'success');
          onClose();
        } catch (e) {
          if (e.code === 'auth/wrong-password') toast('Contraseña actual incorrecta.', 'error');
          else toast('Error: ' + e.message, 'error');
        }
        setLoading(false);
      };

      return (
        <div className="overlay" onClick={onClose}>
          <div className="card fin" style={{ maxWidth: 380, width: '100%' }} onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 20 }}>
              <h3 className="fd" style={{ fontWeight: 700, fontSize: '1rem', color: 'var(--tx1)' }}>Cambiar Contraseña</h3>
            </div>
            <div style={{ marginBottom: 12 }}>
              <label className="lbl">Contraseña actual</label>
              <input className="fi" type="password" value={cur} onChange={e => setCur(e.target.value)} placeholder="••••••••" />
            </div>
            <div style={{ marginBottom: 12 }}>
              <label className="lbl">Nueva contraseña</label>
              <input className="fi" type="password" value={p1} onChange={e => setP1(e.target.value)} placeholder="••••••••" />
            </div>
            <div style={{ marginBottom: 20 }}>
              <label className="lbl">Confirmar nueva contraseña</label>
              <input className="fi" type="password" value={p2} onChange={e => setP2(e.target.value)} placeholder="••••••••"
                onKeyDown={e => e.key === 'Enter' && save()} />
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button className="bp" style={{ flex: 1 }} onClick={save} disabled={loading}>{loading ? 'Guardando...' : 'Actualizar'}</button>
              <button className="bs" onClick={onClose} disabled={loading}>Cancelar</button>
            </div>
            <p style={{ marginTop: 12, fontSize: '.75rem', color: 'var(--tx4)', textAlign: 'center' }}>
              La contraseña se actualizará para el inicio de sesión con este correo.
            </p>
          </div>
        </div>
      );
    }

        //  CALCULADORA ETP23006
    // ═══════════════════════════════════════════════════
    function ETPCalc() {
      const containerRef = useRef(null);
      const escenario = 1;
      const [tipoCarga, setTipoCarga] = React.useState('DC');
      const [cargaW, setCargaW] = React.useState('');
      const [numBaterias, setNumBaterias] = React.useState('');
      const [ampBateria, setAmpBateria] = React.useState('');
      const [userRect, setUserRect] = React.useState(0);
      const [results, setResults] = React.useState(null);

      React.useEffect(() => {
        const cW = parseFloat(cargaW) || 0;
        const nB = parseFloat(numBaterias) || 0;
        const aB = parseFloat(ampBateria) || 0;
        const VDC = 4800 / 91.1;
        const FUENTES = 2;
        const cargaEfectiva = cW > 5000 ? 5000 : cW;
        const cargaExcedente = cW > 5000 ? cW - 5000 : 0;
        const corrienteCargaTotal = cargaEfectiva / VDC;
        const corrienteBateriasTotal = nB * aB;
        const Q_total = corrienteBateriasTotal + corrienteCargaTotal;
        let corrienteCargaA, corrienteBateriasA, corrienteTotalPorFuente;
        if (escenario === 1) {
          corrienteCargaA = corrienteCargaTotal / FUENTES;
          corrienteBateriasA = corrienteBateriasTotal / FUENTES;
          corrienteTotalPorFuente = Q_total / FUENTES;
        } else {
          corrienteCargaA = corrienteCargaTotal;
          corrienteBateriasA = corrienteBateriasTotal;
          corrienteTotalPorFuente = Q_total;
        }
        const MAX_AMP_70 = (70 * 80) / 121;
        let autoRect = Math.ceil(corrienteTotalPorFuente / MAX_AMP_70);
        if (autoRect === 0 && corrienteTotalPorFuente > 0) autoRect = 1;
        if (autoRect > 3) autoRect = 3;
        const rectPorFuente = userRect > 0 ? userRect : autoRect;
        const corrientePorRect = rectPorFuente > 0 ? corrienteTotalPorFuente / rectPorFuente : 0;
        const percReg = (corrientePorRect * 121) / 80;
        const consumoAC = ((Math.ceil(percReg) * 20.5) / 121) * rectPorFuente;
        const consumoACTotal = consumoAC * FUENTES;
        const totalSistema = escenario === 1 ? Q_total : Q_total * FUENTES;
        let invPorFuente = tipoCarga === 'AC' && cargaEfectiva > 0 ? Math.min(Math.ceil(cargaEfectiva / 2000), 3) : 0;
        setResults({ corrienteCargaA, corrienteBateriasA, corrienteTotalPorFuente, corrienteBateriasTotal, totalSistema, consumoAC, consumoACTotal, rectPorFuente: rectPorFuente * FUENTES, corrientePorRect, percReg, invPorFuente, cargaExcedente, autoRect });
      }, [escenario, tipoCarga, cargaW, numBaterias, ampBateria, userRect]);

      const r = results;
      const fmt = (v, d=2) => (v||0).toFixed(d);
      const overloaded = r && r.percReg > 70;
      const invAlert = r && r.invPorFuente >= 3 && tipoCarga === 'AC' && parseFloat(cargaW) > 6000;

      return (
        <div className="fin">
          <div style={{ marginBottom: 20 }}>

            <p style={{ color: 'var(--tx3)', fontSize: '.85rem' }}>Cálculo de rectificadores, inversores y modulación de carga (N+1) para fuentes Huawei.</p>
          </div>

          {/* Escenario I — Carga Compartida (único) */}
          <div style={{ marginBottom: 16, background: 'rgba(1, 102, 255,.08)', border: '1px solid rgba(1, 102, 255,.25)', borderRadius: 8, padding: '8px 14px', display: 'inline-flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontFamily: "'Outfit', 'Montserrat', sans-serif", fontWeight: 700, fontSize: '.78rem', color: '#0166ff', textTransform: 'uppercase', letterSpacing: '.06em' }}>Escenario I – Carga Compartida</span>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
            {/* Parámetros */}

              <h3 className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: 'var(--tx2)', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: 16 }}>1. Demanda de Energía</h3>
              <div style={{ marginBottom: 12 }}>
                <label className="lbl">Tipo de Carga</label>
                <select className="fi" value={tipoCarga} onChange={e => setTipoCarga(e.target.value)}>
                  <option value="DC">Carga DC (Solo Rectificadores)</option>
                  <option value="AC">Carga AC (Requiere Inversores)</option>
                </select>
              </div>
              <div>
                <label className="lbl">Carga Total Requerida (W)</label>
                <input className="fi" type="number" value={cargaW} onChange={e => { setCargaW(e.target.value); setUserRect(0); }} placeholder="Ej: 5800" />
              </div>
            </div>
            <div className="card">
              <h3 className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: 'var(--tx2)', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: 16 }}>2. Almacenamiento (Baterías)</h3>
              <div style={{ marginBottom: 12 }}>
                <label className="lbl">Módulos Pylontech (US/UP)</label>
                <input className="fi" type="number" value={numBaterias} onChange={e => setNumBaterias(e.target.value)} placeholder="Ej: 6" />
              </div>
              <div>
                <label className="lbl">Amperaje de Carga (Por Batería)</label>
                <input className="fi" type="number" value={ampBateria} onChange={e => setAmpBateria(e.target.value)} placeholder="Ej: 10" />
              </div>
            </div>
          </div>

          {r && (
            <>
              {/* Métricas de Corriente Symmetrical Layout */}
              <div className="card" style={{ marginBottom: 14 }}>
                <h3 className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: 'var(--amber)', textTransform: 'uppercase', letterSpacing: '.1em', marginBottom: 14 }}>Análisis de Corriente (Por Fuente A/B)</h3>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 10 }}>

                    ['Carga Activa (DC)', fmt(r.corrienteCargaA) + ' A', '#0166ff', false],

                    ['Total Baterías (A+B)', fmt(r.corrienteBateriasTotal) + ' A', '#21c0fa', false],
                    ['Total Entrada AC (A+B)', fmt(r.consumoACTotal) + ' A', '#008000', false],
                    ['Total Sistema (A+B)', fmt(r.totalSistema) + ' A', '#f55b5d', true]
                  ].map(([lbl, val, color, isFeatured]) => (
                    <div key={lbl} style={{
                      background: isFeatured ? 'rgba(245, 91, 93, 0.06)' : 'var(--bg-deep)',
                      border: isFeatured ? '1px solid rgba(245, 91, 93, 0.3)' : '1px solid var(--border)',
                      borderRadius: 10,
                      padding: '12px 14px',

                    }}>
                      <div style={{ fontSize: '.68rem', color: isFeatured ? '#f55b5d' : 'var(--tx3)', marginBottom: 4, fontFamily: "'Outfit', 'Montserrat', sans-serif", textTransform: 'uppercase', fontWeight: 600 }}>{lbl}</div>
                      <div className="fm" style={{ fontSize: isFeatured ? '1.25rem' : '1.1rem', fontWeight: 800, color }}>{val}</div>
                    </div>

              {/* Rectificadores */}
              <div className="card" style={{ marginBottom: 14, border: '1px solid var(--border)', position: 'relative' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 16, marginBottom: 16 }}>
                  <div>
                    <h3 className="fd" style={{ fontSize: '.84rem', fontWeight: 700, color: 'var(--tx1)', textTransform: 'uppercase', letterSpacing: '.06em' }}>
                      MÓDULO RECTIFICADOR HUAWEI R4875G5 <span style={{ color: 'var(--tx4)', fontWeight: 400 }}>48VDC / 75ADC</span>
                    </h3>
                  </div>

                  {/* Esquina Superior Derecha: Sistema Completo al lado de la Selección de Módulos */}
                  <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
                    <div style={{ background: 'var(--bg-deep)', padding: '6px 14px', borderRadius: 10, border: '1px solid var(--border)', display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ color: 'var(--tx3)', fontSize: '.78rem', fontWeight: 600 }}>Sistema Completo:</span>

                    </div>

                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ fontSize: '.72rem', color: 'var(--tx3)', fontWeight: 600 }}>Selecciona configuración (Por Fuente):</span>
                      <div style={{ display: 'flex', gap: 6 }}>
                        {[1,2,3].map(n => {
                          const hAmp = r.corrienteTotalPorFuente / n;
                          const hPerc = (hAmp * 121) / 80;
                          const isOver = hPerc > 70;

                                background: isActive ? (isOver ? '#f55b5d' : '#0166ff') : 'var(--bg-surface)',
                                color: isActive ? '#fff' : (isOver ? '#f55b5d' : 'var(--tx2)'),
                                borderColor: isOver ? (isActive ? '#f55b5d' : 'rgba(245, 91, 93,.4)') : (isActive ? '#0166ff' : 'var(--border)') }}>
                              {n} {n === 1 ? 'Mód' : 'Móds'}<br />
                              <span style={{ fontSize: '.68rem', fontWeight: 600 }}>{Math.ceil(hPerc)}%</span>
                            </button>

                        })}
                      </div>
                    </div>
                  </div>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
                  {[
                    ['Corriente por Módulo', fmt(r.corrientePorRect, 3) + ' A'],
                    ['Carga de Trabajo', fmt(r.percReg, 3) + '% ≈ ' + Math.ceil(r.percReg) + '%'],
                    ['Entrada AC (por Fuente)', fmt(r.consumoAC) + ' A']
                  ].map(([lbl, val]) => (
                    <div key={lbl} style={{ background: 'var(--bg-deep)', padding: '10px 14px', borderRadius: 10, border: '1px solid var(--border)' }}>
                      <div style={{ fontSize: '.72rem', color: 'var(--tx3)', marginBottom: 4, fontWeight: 600 }}>
                        {lbl}

                      <div className="fm" style={{ fontSize: '1.05rem', fontWeight: 800, color: overloaded ? '#f55b5d' : '#0166ff' }}>{val}</div>

                {overloaded && (

                    <IconAlertTriangle size={15} color="#f55b5d" />
