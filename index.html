    // ═══════════════════════════════════════════════════
    //  CALCULADORA DE AUTONOMÍA STANDALONE
    // ═══════════════════════════════════════════════════
    // Input de autonomía fuera del componente → sin pérdida de foco al escribir
    function AutonomiaInput({ label, val, onChange, unit, small }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6, height: '100%' }}>
          <label style={{ display: 'flex', alignItems: 'center', fontSize: '.68rem', color: 'var(--tx3)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 0, fontFamily: "'Outfit', 'Montserrat', sans-serif", whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }} title={label}>
            <span>{label}{unit && <span style={{ color: 'var(--amber)', marginLeft: 3 }}>({unit})</span>}</span>
          </label>
          <input className="mi" type="text" inputMode="decimal" value={val}
            onChange={e => onChange(e.target.value)}
            style={{ fontSize: small ? '.8rem' : '.88rem' }} placeholder="0" />
        </div>
      );
    }

    function AutonomiaCalc() {
      const [bancos, setBancos] = useState([
        { id: 1, tipo: 'LFP', capacidad: '', Vn: '48', SoH: '1.0', DoD: '0.8', ebanco: '0.98', eTemp: '1.0', carga: '', resultado: null }
      ]);

      const addBanco = () => setBancos(prev => [...prev, {
        id: Date.now(), tipo: 'LFP', capacidad: '', Vn: '48', SoH: '1.0', DoD: '0.8', ebanco: '0.98', eTemp: '1.0', carga: '', resultado: null
      }]);

      const removeBanco = id => setBancos(prev => prev.filter(b => b.id !== id));

      const updateBanco = (id, key, val) => setBancos(prev => prev.map(b => {
        if (b.id !== id) return b;
        const nb = { ...b, [key]: val };
        // Auto-fill defaults when type changes
        if (key === 'tipo') {
          const def = BAT_DEFAULTS[val] || BAT_DEFAULTS.LFP;
          const Vn = BAT_VN[val] || 48;
          nb.Vn = String(Vn);
          nb.DoD = String(def.DoD);
          nb.SoH = String(def.SoH);
          nb.ebanco = String(def.ebanco);
        }
        // Recalculate autonomy
        const toNum = s => parseFloat((s || '').toString().replace(',', '.'));
        const cap = toNum(nb.capacidad) || 0;
        const load = toNum(nb.carga) || 0;
        if (cap > 0 && load > 0) {
          const Vn = toNum(nb.Vn) || 48;
          const SoH = toNum(nb.SoH) || 1;
          const DoD = toNum(nb.DoD) || 0.8;
          const eb = toNum(nb.ebanco) || 0.95;
          const eT = toNum(nb.eTemp) || 1;
          const ereg = (BAT_DEFAULTS[nb.tipo] || BAT_DEFAULTS.LFP).ereg;
          nb.resultado = (Vn * cap * SoH * DoD * eb * eT) / (load * 1000 / ereg);
        } else {
          nb.resultado = null;
        }
        return nb;
      }));

      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
            <div>
              <div className="fd" style={{ fontSize: '.85rem', fontWeight: 700, color: 'var(--tx2)', textTransform: 'uppercase', letterSpacing: '.06em' }}>Calculadora de Autonomía</div>
              <div style={{ fontSize: '.74rem', color: 'var(--tx4)', marginTop: 2 }}>t = (Vn × Cap × SoH × DoD × η) / (Carga_kW × 1000 / ηreg)</div>
            </div>
            <button className="bg" style={{ fontSize: '.8rem', padding: '7px 14px' }} onClick={addBanco}>+ Banco</button>
          </div>

          {bancos.map((b, idx) => {
            const autColor = !b.resultado ? '#64748b' : b.resultado > 4 ? '#008000' : b.resultado > 2 ? '#0166ff' : '#f55b5d';
            return (
              <div key={b.id} className="card" style={{ marginBottom: 12, border: '1px solid var(--border)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <span className="fd" style={{ fontWeight: 700, color: 'var(--tx1)', fontSize: '.9rem' }}>Banco {idx + 1}</span>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                    {b.resultado && (
                      <div style={{ textAlign: 'right' }}>
                        <div className="fm" style={{ fontSize: '1.5rem', fontWeight: 800, color: autColor, lineHeight: 1 }}>{fmtHours(b.resultado)}</div>
                        <div style={{ fontSize: '.65rem', color: 'var(--tx3)' }}>autonomía estimada</div>
                      </div>
                    )}
                    {bancos.length > 1 && <button onClick={() => removeBanco(b.id)} className="bd" style={{ padding: '4px 10px', fontSize: '.72rem' }}>✕</button>}
                  </div>
                </div>

                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(130px,1fr))', gap: 10, alignItems: 'stretch' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'space-between', height: '100%' }}>
                    <label className="lbl" style={{ minHeight: '2.5em', display: 'flex', alignItems: 'flex-end', marginBottom: 4 }}>Tipo de Batería</label>
                    <select className="fi" value={b.tipo} onChange={e => updateBanco(b.id, 'tipo', e.target.value)}>

                  <AutonomiaInput label="η Banco" unit="" val={b.ebanco} onChange={v => updateBanco(b.id, 'ebanco', v)} small />
                  <AutonomiaInput label="η Temp" unit="" val={b.eTemp} onChange={v => updateBanco(b.id, 'eTemp', v)} small />
                </div>

                {!b.resultado && b.capacidad && b.carga && (
                  <div style={{ marginTop: 8, fontSize: '.75rem', color: '#0166ff' }}>Completa capacidad y carga para calcular.</div>
                )}
              </div>
            );
          })}

          {bancos.some(b => b.resultado) && (
            <div style={{ background: 'rgba(0, 128, 0,.08)', border: '1px solid rgba(0, 128, 0,.2)', borderRadius: 8, padding: '12px 16px', marginTop: 4 }}>
              <div className="fd" style={{ fontSize: '.72rem', fontWeight: 700, color: 'var(--tx3)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 8 }}>Resumen</div>

                <div key={b.id} style={{ display: 'flex', justifyContent: 'space-between', padding: '5px 0', borderBottom: '1px solid var(--border)' }}>

              ))}
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    //  VISTA STANDALONE DE AUTONOMÍA
    // ═══════════════════════════════════════════════════
    function SimpleAutonomiaCalc() {
      const [cargaW, setCargaW] = useState('');
      const [horas, setHoras] = useState('');

      const toNum = s => parseFloat((s || '').toString().replace(',', '.'));
      const P = toNum(cargaW) || 0;
      const t = toNum(horas) || 0;

      const gel100 = P > 0 && t > 0 ? Math.ceil((P * t) / (48 * 100 * 0.6 * 0.25 * 0.95 * 0.85)) * 4 : 0;
      const gel200 = P > 0 && t > 0 ? Math.ceil((P * t) / (48 * 200 * 0.6 * 0.25 * 0.95 * 0.85)) * 4 : 0;
      const lfp100 = P > 0 && t > 0 ? Math.ceil((P * t) / (48 * 100 * 0.8 * 1.0 * 0.98 * 0.85)) : 0;
      const nmc52 = P > 0 && t > 0 ? Math.ceil((P * t) / (52.5 * 66 * 0.8 * 0.45 * 0.95 * 0.85)) : 0;

      return (
        <div className="card" style={{ marginBottom: 20, borderColor: 'rgba(0, 128, 0,.3)', background: 'rgba(0, 128, 0,.03)' }}>
          <div style={{ marginBottom: 16 }}>
            <h3 className="fd" style={{ fontSize: '1rem', fontWeight: 700, color: 'var(--tx1)' }}>Proyección Rápida de Baterías</h3>
            <div style={{ fontSize: '.75rem', color: 'var(--tx3)' }}>Ingresa los requerimientos para estimar la cantidad de unidades necesarias (para sistemas a 48V).</div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 20 }}>
            <div>
              <label className="lbl">Carga (Watts)</label>
              <div style={{ position: 'relative' }}>
                <input className="fi" type="number" step="any" value={cargaW} onChange={e => setCargaW(e.target.value)} placeholder="Ej: 1500" style={{ paddingRight: 40, fontSize: '1.1rem', fontWeight: 600 }} />
                <span style={{ position: 'absolute', right: 12, top: 10, color: 'var(--tx4)', fontSize: '.8rem', fontWeight: 700 }}>W</span>
              </div>
            </div>
            <div>
              <label className="lbl">Autonomía Deseada (Horas)</label>
              <div style={{ position: 'relative' }}>
                <input className="fi" type="number" step="any" value={horas} onChange={e => setHoras(e.target.value)} placeholder="Ej: 4" style={{ paddingRight: 40, fontSize: '1.1rem', fontWeight: 600 }} />
                <span style={{ position: 'absolute', right: 12, top: 10, color: 'var(--tx4)', fontSize: '.8rem', fontWeight: 700 }}>h</span>
              </div>
            </div>
          </div>

          {(P > 0 && t > 0) ? (
            <div>
              <div className="fd" style={{ fontSize: '.75rem', fontWeight: 700, color: 'var(--tx3)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 10 }}>Configuraciones Sugeridas</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12 }}>
                <div style={{ background: 'var(--bg-deep)', padding: 12, borderRadius: 8, border: '1px solid var(--border)' }}>
                  <div style={{ color: 'var(--tx2)', fontSize: '.8rem', fontWeight: 600, marginBottom: 4 }}>Pylontech LFP (48V 100Ah)</div>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                    <span className="fm" style={{ fontSize: '1.6rem', color: '#008000', fontWeight: 800 }}>{lfp100}</span>
                    <span style={{ fontSize: '.75rem', color: 'var(--tx4)' }}>unidades</span>
                  </div>
                </div>
                <div style={{ background: 'var(--bg-deep)', padding: 12, borderRadius: 8, border: '1px solid var(--border)' }}>
                  <div style={{ color: 'var(--tx2)', fontSize: '.8rem', fontWeight: 600, marginBottom: 4 }}>Baterías GEL (12V 200Ah)</div>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                    <span className="fm" style={{ fontSize: '1.6rem', color: '#0166ff', fontWeight: 800 }}>{gel200}</span>
                    <span style={{ fontSize: '.75rem', color: 'var(--tx4)' }}>unidades ({gel200 / 4} arreglos)</span>
                  </div>
                </div>
                <div style={{ background: 'var(--bg-deep)', padding: 12, borderRadius: 8, border: '1px solid var(--border)' }}>
                  <div style={{ color: 'var(--tx2)', fontSize: '.8rem', fontWeight: 600, marginBottom: 4 }}>Paquetes NMC (52.5V 66Ah)</div>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                    <span className="fm" style={{ fontSize: '1.6rem', color: '#21c0fa', fontWeight: 800 }}>{nmc52}</span>
                    <span style={{ fontSize: '.75rem', color: 'var(--tx4)' }}>paquetes</span>
                  </div>
                </div>
                <div style={{ background: 'var(--bg-deep)', padding: 12, borderRadius: 8, border: '1px solid var(--border)' }}>
                  <div style={{ color: 'var(--tx2)', fontSize: '.8rem', fontWeight: 600, marginBottom: 4 }}>Baterías GEL (12V 100Ah)</div>
                  <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                    <span className="fm" style={{ fontSize: '1.6rem', color: '#64748b', fontWeight: 800 }}>{gel100}</span>
                    <span style={{ fontSize: '.75rem', color: 'var(--tx4)' }}>unidades ({gel100 / 4} arreglos)</span>
                  </div>
                </div>
              </div>
            </div>
          ) : (
            <div style={{ textAlign: 'center', padding: '20px 0', color: 'var(--tx4)', fontSize: '.85rem' }}>
              Ingresa la carga y las horas para ver la proyección de unidades.
            </div>
          )}
        </div>
      );
    }

    function AutonomiaWrapper() {
      return (
        <div className="fin">
          <div style={{ marginBottom: 20 }}>
            <h1 className="fd" style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--tx1)', marginBottom: 4 }}> Calculadoras de Autonomía</h1>
            <p style={{ color: 'var(--tx3)', fontSize: '.85rem' }}>Herramientas para proyectar requerimientos y estimar el rendimiento de la red.</p>

          { nombre: "TORNILLOS PARA RAMPLUNG NARANJA", cantidad: 4 * soportesCantidad, unidad: "und", seccion: "escalerillas", orden: 505 },
          { nombre: "RAMPLUG NARANJA 3/8\"", cantidad: 4 * soportesCantidad, unidad: "und", seccion: "escalerillas", orden: 506 },
          { nombre: "ARANDELAS 5*16", cantidad: 4 * soportesCantidad, unidad: "und", seccion: "escalerillas", orden: 507 }
        ];
      };

      const consolidarResultados = () => {
        let todos = [
          ...calcularFuentes(),
          ...calcularRack(),
          ...calcularEntradaAC(),
          ...calcularSalidaAC(),
          ...calcularSalidaDC(),
          ...calcularEscalerillas()
        ];
        
        const mapa = new Map();
        for (let item of todos) {
          if (item.cantidad === 0) continue;
          const key = item.nombre;
          if (mapa.has(key)) {
            mapa.get(key).cantidad += item.cantidad;
          } else {
            mapa.set(key, { nombre: item.nombre, cantidad: item.cantidad, unidad: item.unidad, seccion: item.seccion, orden: item.orden });
          }
        }
        
        let consolidado = Array.from(mapa.values());
        consolidado.sort((a, b) => a.orden - b.orden);
        return consolidado.map((item, idx) => ({ ...item, id: idx }));
      };

      const calcular = () => {
        const res = consolidarResultados();
        setResultados(res);
      };

      const copy = () => {
        if (!resultados || !resultados.length) return;
        let txt = 'AIRTEK - MATERIALES TOTALES\n';
        if (proyecto) txt += 'Proyecto: ' + proyecto + '\n';
        txt += 'Fecha: ' + new Date().toLocaleString() + '\n';
        txt += '----------------------------------------\n\n';
        resultados.forEach(r => {
          const c = Number.isInteger(r.cantidad) ? r.cantidad : r.cantidad.toFixed(2);
          txt += r.nombre + ': ' + c + ' ' + r.unidad + '\n';
        });
        navigator.clipboard.writeText(txt).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); document.body.removeChild(ta);
        });
      };

      const exportXlsx = () => {
        if (!resultados || !resultados.length) return;
        const rows = resultados.map(r => ({
          'Material': r.nombre,
          'Cantidad': Number.isInteger(r.cantidad) ? r.cantidad : parseFloat(r.cantidad.toFixed(2)),
          'Unidad': r.unidad,
          'Sección': r.seccion,
        }));
        const wb = window.XLSX.utils.book_new();
        const ws = window.XLSX.utils.json_to_sheet(rows);
        ws['!cols'] = [{ wch: 55 }, { wch: 12 }, { wch: 10 }, { wch: 14 }];
        window.XLSX.utils.book_append_sheet(wb, ws, 'Materiales');
        window.XLSX.writeFile(wb, 'materiales_airtek_' + Date.now() + '.xlsx');
      };

      const removeResultadoItem = (id) => {
        setResultados(prev => prev.filter(item => item.id !== id));
      };

      const FI2 = ({ label, k, placeholder, type = 'number' }) => (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <label className="lbl" style={{ whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', marginBottom: 0, fontSize: '.76rem', fontWeight: 600, color: 'var(--tx2)' }} title={label}>
            {label}
          </label>
          <input className="fi" type={type} value={f[k]} onChange={e => setF(p => ({ ...p, [k]: e.target.value }))} placeholder={placeholder || '0'} />
        </div>
      );

      return (
        <div className="fin">
          <div style={{ marginBottom: 18 }}>
            <h1 className="fd" style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--tx1)', marginBottom: 4 }}>Calculadora de Materiales</h1>
            <p style={{ color: 'var(--tx3)', fontSize: '.85rem' }}>Todos los materiales en una sola lista consolidada</p>
          </div>

          <div className="card" style={{ marginBottom: 14 }}>
            <label className="lbl">Nombre del Proyecto (opcional)</label>
            <input className="fi" type="text" value={proyecto} onChange={e => setProyecto(e.target.value)}
              placeholder="Ej: Nodo Bella Vista — Instalación ETP" />
          </div>

          {/* Fuentes */}
          <div className="card" style={{ marginBottom: 14 }}>
            <div className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: 'var(--amber)', textTransform: 'uppercase', letterSpacing: '.08em', marginBottom: 14 }}>FUENTES ETP HUAWEI 23006</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '14px 16px' }}>
              <FI2 label="Cantidad de fuentes" k="fuentesCantidad" />
              <FI2 label="Alimentación de fuente (AWG)" k="alimentacionFuente" />
              <FI2 label="Cantidad de rectificadores" k="rectificadores" />
              <FI2 label="Cantidad de inversores" k="inversores" />
              <FI2 label="Módulo solar G1" k="moduloSolarG1" />
              <FI2 label="Módulo solar G6" k="moduloSolarG6" />
            </div>
          </div>

          {/* Rack */}
          <div className="card" style={{ marginBottom: 14 }}>
            <div className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: 'var(--purple)', textTransform: 'uppercase', letterSpacing: '.08em', marginBottom: 14 }}>RACK + BATERÍAS PYLONTECH</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '14px 16px' }}>
              <FI2 label="Cantidad de racks" k="racksCantidad" />
              <FI2 label="Cantidad de baterías" k="bateriasCantidad" />
              <FI2 label="Jumpers largos" k="jumpersLargos" />
            </div>
          </div>

          {/* Entrada AC */}
          <div className="card" style={{ marginBottom: 14 }}>
            <div className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: 'var(--blue)', textTransform: 'uppercase', letterSpacing: '.08em', marginBottom: 14 }}>ENTRADA AC</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '14px 16px' }}>
              <FI2 label="Tipo de aislamiento" k="aislamientoEntradaAC" type="text" placeholder="THW" />
              <FI2 label="Calibre de conductor (AWG)" k="calibreEntradaAC" />
              <FI2 label="Metros lineales" k="metrosEntradaAC" />
              <FI2 label="Racks a conectar" k="racksEntradaAC" />
              <FI2 label="Fuentes a conectar" k="fuentesEntradaAC" />
            </div>
          </div>

          {/* Salida AC */}
          <div className="card" style={{ marginBottom: 14 }}>
            <div className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: 'var(--red)', textTransform: 'uppercase', letterSpacing: '.08em', marginBottom: 14 }}>SALIDA AC</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '14px 16px' }}>
              <FI2 label="Tipo de aislamiento" k="aislamientoSalidaAC" type="text" placeholder="AUTO" />
              <FI2 label="Calibre de conductor (AWG)" k="calibreSalidaAC" />
              <FI2 label="Metros lineales" k="metrosSalidaAC" />
              <FI2 label="Racks a alimentar" k="racksSalidaAC" />
              <FI2 label="PDU AC" k="pduAC" />
            </div>
          </div>

          {/* Salida DC */}
          <div className="card" style={{ marginBottom: 14 }}>
            <div className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: 'var(--green)', textTransform: 'uppercase', letterSpacing: '.08em', marginBottom: 14 }}>SALIDA DC</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '14px 16px' }}>
              <FI2 label="Tipo de aislamiento" k="aislamientoSalidaDC" type="text" placeholder="AUTOMOTRIZ" />
              <FI2 label="Calibre de conductor (AWG)" k="calibreSalidaDC" />
              <FI2 label="Metros lineales" k="metrosSalidaDC" />
              <FI2 label="Racks a alimentar" k="racksSalidaDC" />
              <FI2 label="Equipos #10" k="equipos10" />
              <FI2 label="Equipos #14" k="equipos14" />
            </div>
          </div>

          {/* Escalerillas */}
          <div className="card" style={{ marginBottom: 14 }}>
            <div className="fd" style={{ fontSize: '.78rem', fontWeight: 700, color: '#64748b', textTransform: 'uppercase', letterSpacing: '.08em', marginBottom: 14 }}>ESCALERILLAS Y SOPORTES</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: '14px 16px' }}>
              <FI2 label="Soportes de techo" k="soportesCantidad" />
            </div>
          </div>

          <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 16 }}>
            <button className="bp" style={{ fontSize: '.88rem', padding: '10px 28px', minWidth: 220 }} onClick={calcular}>
              Calcular Materiales Totales
            </button>
          </div>

          {resultados === null && (
            <div className="card" style={{ textAlign: 'center', padding: 32, color: 'var(--tx3)' }}>
              Complete los valores y presione Calcular
            </div>
          )}

          {resultados !== null && resultados.length === 0 && (
            <div className="card" style={{ textAlign: 'center', padding: 32, color: 'var(--tx3)' }}>
              No hay materiales con cantidad positiva. Ingrese al menos un valor.
            </div>
          )}

          {resultados !== null && resultados.length > 0 && (
            <div>
              <div style={{ border: '1px solid var(--border)', borderRadius: 8, overflow: 'hidden', marginBottom: 12 }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr auto auto auto', background: 'var(--bg-elevated)', padding: '8px 12px', fontSize: '.7rem', color: 'var(--tx3)', textTransform: 'uppercase', letterSpacing: '.06em', fontFamily: "'Outfit', 'Montserrat', sans-serif" }}>
                  <span>Material</span><span style={{ textAlign: 'center', minWidth: 60 }}>Cantidad</span><span style={{ textAlign: 'center', minWidth: 45 }}>Unidad</span><span style={{ width: 20 }}></span>
                </div>
                {resultados.map((r, i) => {
                  const secColors = {
                    fuentes: 'var(--amber, #f59e0b)',
                    rack: 'var(--purple, #8b5cf6)',
                    entrada_ac: 'var(--blue, #0166ff)',
                    salida_ac: 'var(--red, #ef4444)',
                    salida_dc: 'var(--green, #10b981)',
                    escalerillas: '#64748b'
                  };
                  const c = Number.isInteger(r.cantidad) ? r.cantidad : r.cantidad.toFixed(2);
                  return (
                    <div key={i} style={{
                      display: 'grid', gridTemplateColumns: '1fr auto auto auto', padding: '9px 12px',
                      background: i % 2 === 0 ? 'var(--bg-surface)' : 'var(--bg-card)',
                      borderTop: '1px solid var(--border)', alignItems: 'center', gap: 8
                    }}>
                      <div>
                        <span style={{ display: 'inline-block', width: 7, height: 7, borderRadius: '50%', background: secColors[r.seccion] || '#64748b', marginRight: 8, flexShrink: 0, verticalAlign: 'middle' }}></span>
                        <span style={{ fontSize: '.84rem', color: 'var(--tx1)' }}>{r.nombre}</span>
                      </div>
                      <span className="fm" style={{ fontSize: '1rem', fontWeight: 700, color: 'var(--green)', textAlign: 'center', minWidth: 60 }}>{c}</span>
                      <span style={{ fontSize: '.78rem', color: 'var(--tx3)', textAlign: 'center', minWidth: 45 }}>{r.unidad}</span>
                      <button onClick={() => removeResultadoItem(r.id)} style={{
                        background: 'none', border: 'none', color: 'var(--red)', cursor: 'pointer', padding: '4px 6px', fontSize: '.75rem', fontWeight: 'bold'
                      }}>✕</button>
                    </div>
                  );
                })}
              </div>
              <div style={{ display: 'flex', justifyContent: 'center', gap: 12 }}>
                <button className="bg" style={{ fontSize: '.84rem', padding: '8px 18px', minWidth: 130 }} onClick={copy}>Copiar lista</button>
                <button className="bs" style={{ fontSize: '.84rem', padding: '8px 18px', minWidth: 130 }} onClick={exportXlsx}>Exportar Excel</button>
              </div>
              <div style={{ marginTop: 8, fontSize: '.72rem', color: 'var(--tx4)', display: 'flex', gap: 14, flexWrap: 'wrap' }}>
                <span><span style={{ color: 'var(--amber, #f59e0b)' }}>●</span> Fuentes ETP</span>
                <span><span style={{ color: 'var(--purple, #8b5cf6)' }}>●</span> Rack + Baterías</span>
                <span><span style={{ color: 'var(--blue, #0166ff)' }}>●</span> Entrada AC</span>
                <span><span style={{ color: 'var(--red, #ef4444)' }}>●</span> Salida AC</span>
                <span><span style={{ color: 'var(--green, #10b981)' }}>●</span> Salida DC</span>
                <span><span style={{ color: '#64748b' }}>●</span> Escalerillas</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════
    // APP ROOT
    // ═══════════════════════════════════════════════════
    
    function ConfirmModal({ title, msg, type = 'confirm', confirmText, cancelText, onConfirm, onCancel }) {
      const isDanger = type === 'danger' || type === 'delete';
      const isSuccess = type === 'success';

      const badgeBg = isDanger ? 'rgba(245, 91, 93, 0.15)' : isSuccess ? 'rgba(34, 197, 94, 0.15)' : 'rgba(1, 102, 255, 0.15)';
      const badgeColor = isDanger ? '#f55b5d' : isSuccess ? '#22c55e' : '#0166ff';
      const btnBg = isDanger ? '#f55b5d' : isSuccess ? '#22c55e' : '#0166ff';

      return (
        <div className="overlay" style={{ zIndex: 10000, animation: 'fin 0.2s ease' }} onClick={onCancel}>
          <div className="card fin" onClick={e => e.stopPropagation()} style={{
            width: '90%', maxWidth: 380, padding: '28px 24px 22px', borderRadius: 20,
            position: 'relative', background: 'var(--bg-card)', border: '1px solid var(--border)',
            boxShadow: '0 20px 40px rgba(0,0,0,0.35)', textAlign: 'center'
          }}>
            <button onClick={onCancel} style={{
              position: 'absolute', top: 14, right: 14, width: 28, height: 28, borderRadius: '50%',
              border: 'none', background: 'transparent', color: 'var(--tx3)', cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 700
            }}>✕</button>

            <div style={{
              width: 54, height: 54, borderRadius: '50%', background: badgeBg,
              display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px'
            }}>
              {isDanger && (
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke={badgeColor} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  <line x1="10" y1="11" x2="10" y2="17"></line>
                  <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
              )}
              {isSuccess && (
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={badgeColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              )}
              {!isDanger && !isSuccess && (
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke={badgeColor} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="16" x2="12" y2="12"></line>
                  <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
              )}
            </div>

            <h3 className="fd" style={{ fontSize: '1.05rem', fontWeight: 700, color: 'var(--tx1)', marginBottom: msg ? 8 : 20, lineHeight: 1.35 }}>
              {title}
            </h3>

            {msg && (
              <p style={{ color: 'var(--tx3)', fontSize: '.86rem', marginBottom: 22, lineHeight: 1.5, padding: '0 4px' }}>
                {msg}
              </p>
            )}

            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <button onClick={onConfirm} style={{
                width: '100%', padding: '11px 20px', borderRadius: 24, border: 'none',
                background: btnBg, color: '#ffffff', fontFamily: "'Montserrat', sans-serif",
                fontWeight: 700, fontSize: '.9rem', cursor: 'pointer', boxShadow: `0 4px 14px ${badgeColor}33`
              }}>
                {confirmText || (isDanger ? 'Sí, estoy seguro' : 'Confirmar')}
              </button>
              
              {onCancel && cancelText !== false && (
                <button onClick={onCancel} style={{
                  width: '100%', padding: '8px 20px', borderRadius: 24, border: 'none',
                  background: 'transparent', color: 'var(--tx3)', fontFamily: "'Montserrat', sans-serif",
                  fontWeight: 600, fontSize: '.82rem', cursor: 'pointer'
                }}>
                  {cancelText || 'Cancelar'}
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [authState, setAuthState] = useState('loading');
      const [userProfile, setUserProfile] = useState(null);
      const [authView, setAuthView] = useState('login');
      const [appView, setAppView] = useState('nodes');
      const [toastData, setToastData] = useState(null);
      const [modalConfig, setModalConfig] = useState(null);
      const confirmModal = useCallback((cfg) => setModalConfig(cfg), []);

      const toast = useCallback((msg, type = 'info') => setToastData({ msg, type, key: Date.now() }), []);

      useEffect(() => {
        if (!auth) { setAuthState('error'); return; }
        return auth.onAuthStateChanged(async user => {
          if (!user) { setAuthState('unauthenticated'); setUserProfile(null); return; }
          try {
            // Buscar perfil en Firestore: airtek_users primero, luego energy_users (legacy)
            let snap = await db.collection('airtek_users').doc(user.uid).get();
            if (!snap.exists) snap = await db.collection('energy_users').doc(user.uid).get();

            if (!snap.exists) {
              // Si el usuario existe en Firebase Auth pero aún no tiene doc en Firestore
              const defaultProfile = {
                name: user.displayName || user.email.split('@')[0],
                email: user.email.toLowerCase(),
                role: 'tecnico',
                approved: true,
                createdAt: TS()
              };
              await db.collection('airtek_users').doc(user.uid).set({
                ...defaultProfile,
                apps: { nodos: 'tecnico', pm: null, almacen: null }
              });
              await db.collection('energy_users').doc(user.uid).set(defaultProfile);
              setUserProfile({ uid: user.uid, ...defaultProfile });
              setAuthState('authenticated');
              return;
            }

            const data = snap.data();
            const role = (data.apps && data.apps.nodos) || data.role || 'tecnico';
            const name = data.name || data.nombre || user.displayName || user.email.split('@')[0];
            const approved = data.approved !== false;
            const p = { uid: user.uid, name, email: user.email, role, approved };
            setUserProfile(p);
            setAuthState(approved ? 'authenticated' : 'pending');
          } catch (e) {
            console.warn('Auth state load fallback:', e);
            const p = { uid: user.uid, name: user.email.split('@')[0], email: user.email, role: 'tecnico', approved: true };
            setUserProfile(p);
            setAuthState('authenticated');
          }
        });
      }, []);

      const logout = () => {
        if (auth) auth.signOut();
        setUserProfile(null);
        setAuthState('unauthenticated');
        setAuthView('login');
      };

      // Loading
      if (authState === 'loading') return (
        <div className="gridbg" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ textAlign: 'center' }}>
            <div style={{ width: 50, height: 50, background: '#0166ff', borderRadius: 11, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 12px', boxShadow: '0 0 28px rgba(1, 102, 255,.3)' }}>
              <IconPlug size={26} color="#ffffff" />
            </div>
            <div className="fd" style={{ color: '#0166ff', fontWeight: 800, fontSize: '1.2rem', letterSpacing: '.04em' }}>
              <span style={{ fontFamily: "'Outfit', 'Montserrat', sans-serif", fontWeight: 900, letterSpacing: "0.05em", textTransform: "uppercase" }}>
                AIRTEK<span style={{ fontSize: "0.55em", verticalAlign: "super", fontWeight: 500, color: "var(--tx2)", marginLeft: "2px" }}>®</span>
              </span>
            </div>
            <div style={{ color: 'var(--tx4)', fontSize: '.78rem', marginTop: 4 }}>Inicializando sistema...</div>
          </div>
        </div>
      );

      if (authState === 'error') return (
        <div className="gridbg" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 }}>
          <div className="card" style={{ maxWidth: 400, textAlign: 'center' }}>
            <div style={{ width: 54, height: 54, borderRadius: '50%', background: 'rgba(245, 91, 93, 0.12)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 14px' }}>
              <IconAlertTriangle size={28} color="#f55b5d" />
            </div>
            <h2 className="fd" style={{ color: '#0166ff', marginBottom: 8 }}>Configuración requerida</h2>
            <p style={{ color: 'var(--tx3)', fontSize: '.9rem' }}>Revisa la configuración de Firebase en el archivo HTML y recarga la página.</p>
          </div>
        </div>
      );

      if (authState === 'unauthenticated') {
        if (authView === 'register') return <RegisterPage onBack={() => setAuthView('login')} />;
        return <LoginPage onRegister={() => setAuthView('register')} />;
      }

      if (authState === 'pending') return <PendingPage onLogout={logout} />;

      return (
        <div className="app-container">
          <Sidebar userProfile={userProfile} view={appView} setView={setAppView} onLogout={logout} toast={toast} />
          
          <main className="main-wrapper">
            {appView === 'nodes' && <NodeList userProfile={userProfile} toast={toast} />}
            {appView === 'calc' && <MaterialesCalc />}
            {appView === 'autonomia' && <AutonomiaWrapper />}
            {appView === 'etp' && <ETPCalc />}
            {appView === 'admin' && ['admin', 'supervisor', 'directivo'].includes(userProfile?.role) && <AdminPanel userProfile={userProfile} toast={toast} />}
            {appView === 'admin' && !['admin', 'supervisor', 'directivo'].includes(userProfile?.role) && <NodeList userProfile={userProfile} toast={toast} />}
          </main>

          {toastData && <Toast key={toastData.key} msg={toastData.msg} type={toastData.type} onDone={() => setToastData(null)} />}

          {modalConfig && (
            <ConfirmModal 
              title={modalConfig.title} 
              msg={modalConfig.msg} 
              type={modalConfig.type} 
              confirmText={modalConfig.confirmText} 
              cancelText={modalConfig.cancelText} 
              onConfirm={() => {
                if (modalConfig.onConfirm) modalConfig.onConfirm();
                setModalConfig(null);
              }} 
              onCancel={() => setModalConfig(null)} 
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
